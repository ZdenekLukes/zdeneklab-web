<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#000000">
<title>ZDENEK LAB</title>
<meta name="description" content="ZDENEK LAB — experiments in AI, hardware and embodied intelligence.">
<style>
:root{
  --bg:#020304;
  --fg:#f4f4f2;
  --muted:#7f858c;
  --faint:#3f454c;
  --line:rgba(255,255,255,.10);
}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0}
body{
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 54%, #0c1116 0%, #050709 28%, #020304 58%, #000 100%);
  color:var(--fg);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
.page{
  position:relative;
  width:100%;
  height:100%;
  min-height:620px;
  isolation:isolate;
}
.page::before{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  opacity:.18;
  background-image:
    radial-gradient(circle at 12% 18%, rgba(255,255,255,.9) 0 1px, transparent 1.3px),
    radial-gradient(circle at 73% 16%, rgba(255,255,255,.5) 0 1px, transparent 1.2px),
    radial-gradient(circle at 24% 71%, rgba(255,255,255,.38) 0 1px, transparent 1.2px),
    radial-gradient(circle at 88% 66%, rgba(255,255,255,.42) 0 1px, transparent 1.2px),
    radial-gradient(circle at 54% 8%, rgba(255,255,255,.28) 0 1px, transparent 1.2px),
    radial-gradient(circle at 40% 34%, rgba(255,255,255,.24) 0 1px, transparent 1.2px),
    radial-gradient(circle at 67% 78%, rgba(255,255,255,.28) 0 1px, transparent 1.2px);
  background-size:280px 280px,360px 360px,430px 430px,510px 510px,620px 620px,720px 720px,830px 830px;
  animation:drift 28s linear infinite;
}
.page::after{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  opacity:.08;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.25'/%3E%3C/svg%3E");
  mix-blend-mode:soft-light;
  z-index:20;
}
@keyframes drift{
  from{transform:scale(1.02) translate3d(0,0,0)}
  to{transform:scale(1.08) translate3d(-1.5%,1%,0)}
}

header{
  position:absolute;
  z-index:10;
  top:clamp(24px,4vw,52px);
  left:clamp(26px,4vw,66px);
  right:clamp(26px,4vw,66px);
  display:flex;
  justify-content:space-between;
  align-items:center;
  color:#777d84;
  font:500 10px/1 ui-monospace,SFMono-Regular,Menlo,monospace;
  letter-spacing:.16em;
  text-transform:uppercase;
}
.brand{
  color:#b3b6b9;
  font-weight:700;
  letter-spacing:.24em;
}
.status{
  display:flex;
  align-items:center;
  gap:10px;
}
.dot{
  width:6px;height:6px;border-radius:50%;
  background:#aeb8c1;
  box-shadow:0 0 14px rgba(200,220,240,.65);
  animation:pulse 3s ease-in-out infinite;
}
@keyframes pulse{
  0%,100%{opacity:.25;transform:scale(.8)}
  50%{opacity:1;transform:scale(1.05)}
}

/* The thing in the dark */
.cosmos{
  position:absolute;
  inset:0;
  display:grid;
  place-items:center;
  z-index:1;
  pointer-events:none;
}
.field{
  position:absolute;
  width:min(88vw,1180px);
  aspect-ratio:1;
  border-radius:50%;
  background:
    radial-gradient(circle,
      rgba(190,214,235,.09) 0%,
      rgba(100,135,165,.045) 18%,
      rgba(45,65,82,.02) 34%,
      transparent 65%);
  filter:blur(18px);
  transform:scale(1.05);
}
.ring,.ring::before,.ring::after{
  position:absolute;
  border-radius:50%;
  border:1px solid rgba(210,225,240,.055);
}
.ring{
  width:min(74vw,940px);
  aspect-ratio:1;
  animation:approach 12s ease-in-out infinite alternate;
}
.ring::before,.ring::after{content:"";inset:10%}
.ring::after{inset:22%}
@keyframes approach{
  from{transform:scale(.95);opacity:.5}
  to{transform:scale(1.035);opacity:.9}
}

.planet{
  position:absolute;
  width:min(48vw,620px);
  aspect-ratio:1;
  border-radius:50%;
  background:
    radial-gradient(circle at 46% 38%, #111820 0%, #090d11 34%, #030405 67%, #000 100%);
  box-shadow:
    0 0 0 1px rgba(255,255,255,.035),
    0 -18px 65px rgba(150,190,225,.08),
    0 0 180px rgba(80,115,145,.08);
  transform:translateY(18%);
  animation:planetIn 14s cubic-bezier(.2,.75,.2,1) infinite alternate;
}
.planet::before{
  content:"";
  position:absolute;
  inset:-1px;
  border-radius:50%;
  padding:1px;
  background:linear-gradient(180deg,
    rgba(220,236,250,.20) 0%,
    rgba(150,180,205,.055) 20%,
    transparent 44%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;
  mask-composite:exclude;
}
.planet::after{
  content:"";
  position:absolute;
  left:10%;right:10%;top:-1.2%;
  height:4%;
  border-radius:50%;
  background:radial-gradient(ellipse at center,rgba(210,232,250,.20),rgba(110,150,180,.055) 45%,transparent 72%);
  filter:blur(6px);
}
@keyframes planetIn{
  from{transform:translateY(20%) scale(.985)}
  to{transform:translateY(17%) scale(1.018)}
}

.horizon{
  position:absolute;
  left:50%;
  top:50%;
  width:min(66vw,840px);
  height:1px;
  transform:translate(-50%,72px);
  background:linear-gradient(90deg,transparent,rgba(190,215,235,.05),rgba(225,238,248,.22),rgba(190,215,235,.05),transparent);
  box-shadow:0 0 26px rgba(180,215,245,.13);
  opacity:.75;
}

/* Main reveal */
.hero{
  position:absolute;
  z-index:8;
  left:50%;
  top:48%;
  transform:translate(-50%,-50%);
  width:min(900px,90vw);
  text-align:center;
}
.eyebrow{
  margin:0 0 22px;
  color:#696f76;
  font:500 10px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;
  letter-spacing:.24em;
  text-transform:uppercase;
}
h1{
  margin:0;
  font-size:clamp(68px,11vw,168px);
  line-height:.82;
  letter-spacing:-.07em;
  font-weight:620;
  text-shadow:0 0 44px rgba(210,230,245,.035);
}
h1 span{
  display:block;
  color:#4f555b;
}
.tagline{
  margin:34px auto 0;
  max-width:620px;
  color:#858b91;
  font-size:clamp(15px,1.35vw,20px);
  line-height:1.55;
  letter-spacing:-.01em;
}
.tagline b{color:#c8cccf;font-weight:500}

.signal{
  width:1px;
  height:54px;
  margin:34px auto 0;
  background:linear-gradient(to bottom,rgba(220,235,248,.45),transparent);
  box-shadow:0 0 14px rgba(190,220,245,.12);
  opacity:.5;
}
.signal::after{
  content:"";
  display:block;
  width:5px;height:5px;
  margin-left:-2px;
  border-radius:50%;
  background:#bec9d2;
  box-shadow:0 0 14px rgba(210,230,245,.5);
  animation:signal 3.4s ease-in-out infinite;
}
@keyframes signal{
  0%,100%{transform:translateY(0);opacity:.2}
  50%{transform:translateY(42px);opacity:.85}
}

footer{
  position:absolute;
  z-index:10;
  left:clamp(26px,4vw,66px);
  right:clamp(26px,4vw,66px);
  bottom:clamp(24px,3.6vw,48px);
  display:flex;
  justify-content:space-between;
  align-items:center;
  color:#464b50;
  font:500 10px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;
  letter-spacing:.13em;
  text-transform:uppercase;
}
footer .current{color:#676d73}

@media(max-width:760px){
  .planet{width:82vw}
  .ring{width:118vw}
  .field{width:135vw}
  .hero{top:49%;width:92vw}
  h1{font-size:clamp(68px,20vw,118px)}
  .tagline{max-width:86%;font-size:15px}
  .status{display:none}
  footer .right{display:none}
  .horizon{width:90vw}
}
@media(prefers-reduced-motion:reduce){
  .page::before,.ring,.planet,.dot,.signal::after{animation:none}
}
</style>
</head>
<body>
<main class="page">
  <header>
    <div class="brand">ZDENEK LAB</div>
    <div class="status"><span class="dot"></span> something is forming</div>
  </header>

  <div class="cosmos" aria-hidden="true">
    <div class="field"></div>
    <div class="ring"></div>
    <div class="planet"></div>
    <div class="horizon"></div>
  </div>

  <section class="hero">
    <p class="eyebrow">Independent experiments · Prague</p>
    <h1>ZDENEK<span>LAB</span></h1>
    <p class="tagline">
      Somewhere between <b>AI, hardware and curiosity</b>,<br>
      something is beginning to move.
    </p>
    <div class="signal"></div>
  </section>

  <footer>
    <div class="current">Experiment 001 · AI HEAD / AI CUBE</div>
    <div class="right">temporary interface · v0.2</div>
  </footer>
</main>
</body>
</html>
