<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#000000">
<title>ZDENEK LAB</title>
<meta name="description" content="ZDENEK LAB — experiments in AI, hardware and embodied intelligence.">
<style>
:root{
  --fg:#e9ecef;
  --muted:#7a828a;
  --faint:#40464d;
}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0}
body{
  overflow:hidden;
  background:#000;
  color:var(--fg);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
.page{
  position:relative;
  width:100%;
  height:100%;
  min-height:620px;
  isolation:isolate;
  background:
    radial-gradient(circle at 50% 47%, rgba(23,32,40,.50) 0%, rgba(7,10,13,.72) 28%, rgba(1,2,3,.96) 66%, #000 100%);
}

/* star field */
.stars{
  position:absolute;
  inset:-5%;
  z-index:0;
  opacity:.48;
  background-image:
    radial-gradient(circle at 8% 20%, rgba(255,255,255,.95) 0 1px, transparent 1.5px),
    radial-gradient(circle at 15% 72%, rgba(255,255,255,.5) 0 1px, transparent 1.3px),
    radial-gradient(circle at 27% 32%, rgba(200,220,240,.38) 0 1px, transparent 1.3px),
    radial-gradient(circle at 39% 12%, rgba(255,255,255,.34) 0 1px, transparent 1.2px),
    radial-gradient(circle at 58% 19%, rgba(255,255,255,.50) 0 1px, transparent 1.3px),
    radial-gradient(circle at 70% 74%, rgba(210,230,245,.34) 0 1px, transparent 1.3px),
    radial-gradient(circle at 84% 29%, rgba(255,255,255,.48) 0 1px, transparent 1.3px),
    radial-gradient(circle at 92% 63%, rgba(255,255,255,.30) 0 1px, transparent 1.2px);
  background-size:240px 240px,330px 330px,410px 410px,520px 520px,610px 610px,760px 760px,880px 880px,980px 980px;
  animation:starDrift 40s linear infinite;
}
@keyframes starDrift{
  from{transform:scale(1.02)}
  to{transform:scale(1.08) translate3d(-1.2%,.7%,0)}
}

/* faint nebula */
.nebula{
  position:absolute;
  inset:0;
  z-index:0;
  pointer-events:none;
  background:
    radial-gradient(ellipse at 50% 41%, rgba(92,126,154,.11) 0%, rgba(42,59,73,.055) 25%, transparent 57%),
    radial-gradient(ellipse at 37% 54%, rgba(45,63,82,.07) 0%, transparent 50%),
    radial-gradient(ellipse at 67% 54%, rgba(45,63,82,.06) 0%, transparent 48%);
  filter:blur(34px);
}

/* occasional meteors */
.meteors{
  position:absolute;
  inset:0;
  z-index:3;
  pointer-events:none;
  overflow:hidden;
}
.meteor{
  position:absolute;
  width:3px;
  height:3px;
  border-radius:50%;
  background:rgba(238,247,255,.96);
  box-shadow:0 0 9px rgba(220,240,255,.80);
  opacity:0;
}
.meteor::after{
  content:"";
  position:absolute;
  top:50%;
  right:0;
  width:145px;
  height:1px;
  transform:translateY(-50%);
  transform-origin:right center;
  background:linear-gradient(to left,
    rgba(220,240,255,.60),
    rgba(150,190,220,.18),
    transparent 76%);
  filter:blur(.35px);
}
.m1{top:13%;left:84%;animation:meteor1 9.5s linear infinite;animation-delay:.7s}
.m2{top:22%;left:27%;animation:meteor2 13.5s linear infinite;animation-delay:4.3s}
.m3{top:34%;left:93%;animation:meteor3 16s linear infinite;animation-delay:7.4s}
.m4{top:10%;left:60%;animation:meteor4 20s linear infinite;animation-delay:11.5s}

@keyframes meteor1{
  0%,4%{transform:translate(0,0) rotate(145deg) scale(.75);opacity:0}
  6%{opacity:.95}
  15%{transform:translate(-260px,190px) rotate(145deg) scale(1);opacity:.75}
  18%,100%{transform:translate(-300px,220px) rotate(145deg) scale(1);opacity:0}
}
@keyframes meteor2{
  0%,9%{transform:translate(0,0) rotate(37deg) scale(.65);opacity:0}
  11%{opacity:.75}
  18%{transform:translate(180px,125px) rotate(37deg) scale(.95);opacity:.62}
  21%,100%{transform:translate(225px,155px) rotate(37deg) scale(.95);opacity:0}
}
@keyframes meteor3{
  0%,13%{transform:translate(0,0) rotate(146deg) scale(.7);opacity:0}
  15%{opacity:.85}
  22%{transform:translate(-210px,155px) rotate(146deg) scale(.95);opacity:.65}
  25%,100%{transform:translate(-245px,180px) rotate(146deg) scale(.95);opacity:0}
}
@keyframes meteor4{
  0%,18%{transform:translate(0,0) rotate(142deg) scale(.6);opacity:0}
  20%{opacity:.65}
  27%{transform:translate(-175px,125px) rotate(142deg) scale(.9);opacity:.52}
  30%,100%{transform:translate(-210px,150px) rotate(142deg) scale(.9);opacity:0}
}

/* central object */
.cosmos{
  position:absolute;
  inset:0;
  z-index:1;
  display:grid;
  place-items:center;
  pointer-events:none;
}
.halo{
  position:absolute;
  width:min(82vw,1040px);
  aspect-ratio:1;
  border-radius:50%;
  background:
    radial-gradient(circle,
      rgba(170,205,232,.14) 0%,
      rgba(86,122,151,.07) 28%,
      rgba(35,53,68,.03) 43%,
      transparent 67%);
  filter:blur(14px);
  animation:haloBreath 9s ease-in-out infinite alternate;
}
@keyframes haloBreath{
  from{transform:scale(.985);opacity:.72}
  to{transform:scale(1.035);opacity:1}
}

.rings,
.rings::before,
.rings::after{
  position:absolute;
  border-radius:50%;
  border:1px solid rgba(190,214,232,.055);
}
.rings{
  width:min(72vw,900px);
  aspect-ratio:1;
  opacity:.72;
}
.rings::before,.rings::after{content:"";inset:10%}
.rings::after{inset:23%;border-color:rgba(190,214,232,.035)}

.planet{
  position:absolute;
  width:min(49vw,635px);
  aspect-ratio:1;
  border-radius:50%;
  transform:translateY(18%);
  background:
    radial-gradient(circle at 48% 33%,
      rgba(19,29,38,.95) 0%,
      rgba(8,13,18,.98) 31%,
      rgba(3,5,7,1) 62%,
      #000 100%);
  box-shadow:
    0 0 0 1px rgba(255,255,255,.025),
    0 -18px 42px rgba(165,205,236,.10),
    0 -40px 110px rgba(93,136,170,.10),
    0 0 220px rgba(55,85,108,.10);
  animation:planetBreath 13s ease-in-out infinite alternate;
}
@keyframes planetBreath{
  from{transform:translateY(19%) scale(.988)}
  to{transform:translateY(16.5%) scale(1.016)}
}

.planet::before{
  content:"";
  position:absolute;
  inset:-2px;
  border-radius:50%;
  padding:2px;
  background:
    linear-gradient(180deg,
      rgba(235,246,255,.78) 0%,
      rgba(185,218,242,.34) 6%,
      rgba(92,133,166,.11) 17%,
      rgba(30,44,56,.025) 31%,
      transparent 47%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;
  mask-composite:exclude;
  filter:drop-shadow(0 -5px 15px rgba(190,224,249,.46));
}
.planet::after{
  content:"";
  position:absolute;
  left:5%;
  right:5%;
  top:-2.6%;
  height:8%;
  border-radius:50%;
  background:
    radial-gradient(ellipse at center,
      rgba(235,247,255,.72) 0%,
      rgba(162,203,234,.31) 35%,
      rgba(76,113,143,.09) 58%,
      transparent 78%);
  filter:blur(9px);
  opacity:.92;
}

.horizon{
  position:absolute;
  width:min(66vw,840px);
  height:110px;
  left:50%;
  top:50%;
  transform:translate(-50%,7%);
  border-radius:50%;
  background:radial-gradient(ellipse at center,
    rgba(190,220,242,.16) 0%,
    rgba(95,134,163,.06) 34%,
    transparent 70%);
  filter:blur(20px);
  opacity:.76;
}

/* interface */
header{
  position:absolute;
  z-index:10;
  top:clamp(24px,4vw,50px);
  left:clamp(26px,4vw,64px);
  right:clamp(26px,4vw,64px);
  display:flex;
  justify-content:space-between;
  align-items:center;
  color:#686f76;
  font:500 9px/1 ui-monospace,SFMono-Regular,Menlo,monospace;
  letter-spacing:.17em;
  text-transform:uppercase;
}
.brand{color:#969ca2;font-weight:700;letter-spacing:.24em}
.status{display:flex;align-items:center;gap:10px}
.dot{
  width:5px;height:5px;border-radius:50%;
  background:#aab6c0;
  box-shadow:0 0 10px rgba(210,230,246,.55);
  animation:pulse 3.2s ease-in-out infinite;
}
@keyframes pulse{0%,100%{opacity:.2}50%{opacity:1}}

.hero{
  position:absolute;
  z-index:8;
  left:50%;
  top:48%;
  transform:translate(-50%,-50%);
  width:min(760px,88vw);
  text-align:center;
}
.eyebrow{
  margin:0 0 18px;
  color:#555c63;
  font:500 9px/1.3 ui-monospace,SFMono-Regular,Menlo,monospace;
  letter-spacing:.22em;
  text-transform:uppercase;
}
h1{
  margin:0;
  font-size:clamp(34px,4.8vw,72px);
  line-height:.9;
  letter-spacing:-.055em;
  font-weight:520;
  color:rgba(233,237,240,.52);
  text-shadow:0 0 18px rgba(190,220,242,.03);
}
h1 span{
  display:block;
  color:rgba(108,116,124,.34);
}
.tagline{
  margin:22px auto 0;
  max-width:560px;
  color:#707880;
  font-size:clamp(13px,1vw,16px);
  line-height:1.55;
}
.tagline b{color:#aab2b9;font-weight:500}

.signal{
  width:1px;
  height:48px;
  margin:28px auto 0;
  background:linear-gradient(to bottom,rgba(205,228,247,.26),transparent);
  opacity:.45;
}
.signal::after{
  content:"";
  display:block;
  width:4px;height:4px;
  margin-left:-1.5px;
  border-radius:50%;
  background:#aebbc5;
  box-shadow:0 0 11px rgba(210,232,248,.42);
  animation:signal 3.8s ease-in-out infinite;
}
@keyframes signal{
  0%,100%{transform:translateY(0);opacity:.18}
  50%{transform:translateY(37px);opacity:.8}
}

footer{
  position:absolute;
  z-index:10;
  left:clamp(26px,4vw,64px);
  right:clamp(26px,4vw,64px);
  bottom:clamp(24px,3.5vw,46px);
  display:flex;
  justify-content:space-between;
  color:#3f454b;
  font:500 9px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;
  letter-spacing:.13em;
  text-transform:uppercase;
}
footer .current{color:#575e65}

@media(max-width:760px){
  .planet{width:84vw}
  .rings{width:118vw}
  .halo{width:138vw}
  .hero{top:48%;width:92vw}
  h1{font-size:clamp(32px,10vw,54px)}
  .tagline{font-size:13px;max-width:86%}
  .status{display:none}
  footer .right{display:none}
}
@media(prefers-reduced-motion:reduce){
  .stars,.halo,.planet,.dot,.signal::after,.meteor{animation:none}
}
</style>
</head>
<body>
<main class="page">
  <div class="stars"></div>
  <div class="nebula"></div>

  <div class="meteors" aria-hidden="true">
    <span class="meteor m1"></span>
    <span class="meteor m2"></span>
    <span class="meteor m3"></span>
    <span class="meteor m4"></span>
  </div>

  <header>
    <div class="brand">ZDENEK LAB</div>
    <div class="status"><span class="dot"></span> something is forming</div>
  </header>

  <div class="cosmos" aria-hidden="true">
    <div class="halo"></div>
    <div class="rings"></div>
    <div class="planet"></div>
    <div class="horizon"></div>
  </div>

  <section class="hero">
    <p class="eyebrow">Independent experiments · Prague</p>
    <h1>ZDENEK<span>LAB</span></h1>
    <p class="tagline">
      Somewhere between <b>AI, hardware and curiosity</b>,<br>
      something is beginning to move.
    </p>
    <div class="signal"></div>
  </section>

  <footer>
    <div class="current">Experiment 001 · AI HEAD / AI CUBE</div>
    <div class="right">temporary interface · v0.4</div>
  </footer>
</main>
</body>
</html>
