name: LYRA 30-minute progress pulse

on:
  schedule:
    - cron: '9,39 * * * *'
  push:
    paths:
      - '.github/workflows/lyra-progress-pulse.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  pages: write

concurrency:
  group: lyra-progress-pulse
  cancel-in-progress: false

jobs:
  pulse:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Check public LYRA site and record heartbeat
        run: python3 scripts/lyra-progress-pulse.py
      - name: Publish heartbeat without altering engineering verdicts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- lyra-progress.json; then
            echo 'No update outside sprint window'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lyra-progress.json
          git commit -m "status(lyra): public 30-minute progress heartbeat"
          git push origin HEAD:main
          # GITHUB_TOKEN commits do not automatically trigger a branch-source Pages build.
          curl --fail-with-body --silent --show-error --retry 2 --retry-delay 2 -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds"

      - name: Disable this scheduled workflow after the 12-hour window
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(date -u +%Y%m%d%H%M)" -ge "202610281701" ]; then
            curl --fail --silent --show-error -X PUT \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/lyra-progress-pulse.yml/disable"
          fi
