<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Concept Preview</title>
<style>
  :root { --bg: #f4f5f7; --fg: #1d2330; --muted: #5d6677; --panel: rgba(255,255,255,.92); --open: #e8730c; --line: #d5d9e0; }
  @media (prefers-color-scheme: dark) { :root { --bg: #14171d; --fg: #e6e9ef; --muted: #9aa3b2; --panel: rgba(28,32,40,.92); --line: #333a46; } }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 14px/1.4 -apple-system, system-ui, sans-serif; overflow: hidden; }
  #view { position: fixed; inset: 0; touch-action: none; }
  #banner { position: fixed; top: env(safe-area-inset-top, 0); left: 0; right: 0; padding: 8px 16px; background: var(--open); color: #fff; font-weight: 600; text-align: center; z-index: 2; }
  #panel { position: fixed; left: 16px; right: 16px; bottom: 16px; max-width: 520px; max-height: 40vh; overflow: auto; background: var(--panel);
           border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; z-index: 2; }
  #panel h2 { font-size: 13px; margin: 6px 0; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .q { border-left: 3px solid var(--open); padding-left: 8px; margin: 6px 0; }
  .q b { color: var(--open); }
  .small { color: var(--muted); font-size: 12px; }
  .legend span { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin: 0 4px 0 10px; vertical-align: -1px; }
  #err { position: fixed; top: 50%; left: 16px; right: 16px; text-align: center; color: var(--open); }
</style>
<script type="importmap">{ "imports": { "three": "../vendor/three/three.module.min.js?v=c5009ee32250" } }</script>
</head>
<body>
<div id="banner">loading…</div>
<div id="view"></div>
<div id="panel"></div>
<div id="err"></div>
<script type="module">
import { createViewer } from './render3d.js?v=c5009ee32250';

const params = new URLSearchParams(location.search);
const url = params.get('scene') || '../out/box_organizer/scene.json';
function esc(s) { return String(s).replace(/[&<>"]/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch])); }

async function main() {
  const scene3 = await (await fetch(url)).json();
  document.getElementById('banner').textContent = scene3.banner;
  const q = scene3.markers.map((m) => `<div class="q"><b>${esc(m.question)} UNRESOLVED</b> — ${esc(m.text)}<div class="small">concerns ${esc(m.about.join(', '))}</div></div>`).join('');
  document.getElementById('panel').innerHTML = `<h2>${esc(scene3.concept)} · rev ${esc(scene3.revision)}</h2>${q}
    <div class="small legend"><span style="background:#6f8fb8"></span>defined<span style="background:#e8730c"></span>unresolved (provisional)<span style="background:#9aa3b2"></span>reference</div>`;
  createViewer(document.getElementById('view')).show(scene3);
}
main().catch((e) => { document.getElementById('err').textContent = `Cannot load ${url}: ${e.message}`; });
</script>
</body>
</html>
