<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Concept Sketcher</title>
<style>
  :root {
    --bg: #f4f5f7; --panel: #ffffff; --fg: #1d2330; --muted: #5d6677; --line: #d5d9e0;
    --accent: #2f5fb3; --ok: #1f9d55; --bad: #d93025; --open: #e8730c; --grey: #8a93a3;
    --user: #e7eefb; --bar: #1d2330; --bar-fg: #f4f5f7; --new: #e6f4ea; --old: #fdecea;
    --choice: #1f4a94; --choice-edge: #1f4a94; --choice-chosen: #0f2a5c; --choice-ring: #6f9be8; --choice-other: #1f4a94;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #14171d; --panel: #1c2028; --fg: #e6e9ef; --muted: #9aa3b2; --line: #333a46; --user: #22324f; --bar: #0d0f13; --new: #16301f; --old: #3a1c1a;
      --choice: #2f5fb3; --choice-edge: #6f9be8; --choice-chosen: #163a7a; --choice-ring: #9ec1ff; --choice-other: #a9c5f5; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 15px/1.45 -apple-system, system-ui, sans-serif; }
  body { display: grid; grid-template-rows: minmax(0, 1fr) auto auto; height: 100dvh; overflow: hidden; }
  main { display: grid; grid-template-columns: minmax(0, 42%) minmax(0, 1fr); min-height: 0; min-width: 0; }
  #chat { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; grid-template-columns: minmax(0, 1fr); min-height: 0; min-width: 0; overflow: hidden; border-right: 1px solid var(--line); background: var(--panel); }
  #chat header { padding: 10px 16px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 8px; }
  #chat header h1 { font-size: 16px; margin: 0; flex: 1; }
  #log { overflow-y: auto; padding: 12px 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 92%; padding: 8px 12px; border-radius: 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg.user { align-self: flex-end; background: var(--user); }
  .msg.sys { align-self: flex-start; background: var(--bg); border: 1px solid var(--line); }
  .card { align-self: stretch; min-width: 0; overflow-wrap: anywhere; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; background: var(--bg); }
  .card .top { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 6px; }
  .pill { font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; color: #fff; letter-spacing: .03em; white-space: nowrap; }
  .pill.VALID { background: var(--ok); } .pill.INVALID, .pill.STALE { background: var(--bad); } .pill.CLARIFY { background: var(--grey); }
  .pill.ACCEPTED { background: var(--accent); } .pill.REJECTED, .pill.SUPERSEDED { background: var(--grey); } .pill.OPEN { background: var(--open); }
  ol.changes { margin: 8px 0; padding-left: 20px; }
  ol.changes > li { margin: 0 0 8px; }
  .tgt { font-weight: 600; } .kind { font-size: 11px; font-weight: 700; border: 1px solid currentColor; border-radius: 4px; padding: 0 4px; margin-right: 4px; }
  .rows { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 2px 10px; margin-top: 4px; font-size: 14px; }
  .rows .f { color: var(--muted); }
  .now { background: var(--old); padding: 0 4px; border-radius: 4px; }
  .new { background: var(--new); padding: 0 4px; border-radius: 4px; font-weight: 600; }
  .why { grid-column: 2; font-size: 13px; color: var(--muted); }
  .why.open { color: var(--open); font-weight: 600; }
  .fact { font-size: 10px; font-weight: 700; color: var(--accent); border: 1px solid var(--accent); border-radius: 3px; padding: 0 3px; margin-left: 4px; vertical-align: 1px; }
  .box { border-top: 1px dashed var(--line); margin-top: 6px; padding-top: 6px; font-size: 14px; }
  .err { color: var(--bad); } .muted { color: var(--muted); font-size: 13px; }
  details { margin-top: 6px; font-size: 13px; } pre { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 12px; max-height: 240px; overflow: auto; background: var(--panel); padding: 6px; border-radius: 6px; }
  button { font: inherit; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); padding: 6px 12px; cursor: pointer; min-height: 40px; }
  button.primary { background: var(--ok); border-color: var(--ok); color: #fff; font-weight: 600; }
  button.danger { color: var(--bad); font-weight: 600; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  .vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .card.ask .question { font-size: 16px; font-weight: 600; line-height: 1.4; margin: 2px 0; }
  .choices { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .choices button { min-height: 44px; border-radius: 22px; padding: 8px 16px; white-space: normal; text-align: left; background: var(--choice); border-color: var(--choice-edge); color: #fff; font-weight: 600; touch-action: manipulation; }
  .choices button.other { background: var(--panel); border-style: dashed; border-color: var(--choice-other); color: var(--choice-other); font-weight: 400; }
  .choices button.chosen, .choices button.chosen:disabled { background: var(--choice-chosen); border-color: var(--choice-chosen); color: #fff; opacity: 1; box-shadow: 0 0 0 2px var(--panel), 0 0 0 4px var(--choice-ring); }
  .choices button:disabled:not(.chosen) { background: transparent; border-color: var(--line); color: var(--muted); opacity: 1; }
  .choices.obsolete button:not(.chosen) { opacity: .6; }
  .msg .retry { display: block; margin-top: 8px; }
  .warn { margin-top: 4px; padding: 6px 8px; border-radius: 8px; background: var(--old); color: var(--fg); font-weight: 600; font-size: 14px; }
  .thinking { animation: thinking 1.4s ease-in-out infinite; }
  @keyframes thinking { 50% { opacity: .5; } }
  @media (prefers-reduced-motion: reduce) { .thinking { animation: none; } }
  #composer { border-top: 1px solid var(--line); padding: 8px 12px; }
  #chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; }
  #examplesBtn { display: none; }
  #decision .short { display: none; }
  @media (max-width: 760px) { #examplesBtn { display: inline-block; } body.showchips #chips { display: flex; } }
  #chips button { white-space: nowrap; font-size: 13px; min-height: 32px; padding: 4px 10px; border-radius: 999px; }
  #composer form { display: flex; gap: 8px; }
  #composer input { flex: 1; font: inherit; font-size: 16px; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); min-width: 0; }
  /* 3D stage: Mechanical Studio visual language (tools/mechanical_studio/frontend/app.css):
     dark canvas, compact translucent panels, accent-blue toggles, mono values. Always dark. */
  #stage { --s-bg: #0c0f14; --s-panel: #141a23e6; --s-panel2: #1c2431; --s-line: #3a4453; --s-fg: #e9eef5; --s-dim: #96a3b5; --s-accent: #4ea3ff; --s-accent2: #ffb84e;
    position: relative; min-height: 0; min-width: 0; overflow: hidden; background: var(--s-bg); color: var(--s-fg); }
  #view { position: absolute; inset: 0; touch-action: none; }
  #legend { position: absolute; left: 8px; top: 8px; right: 8px; display: flex; flex-wrap: wrap; gap: 4px 8px; font-size: 11.5px; pointer-events: none; }
  #legend span, #legend button { background: var(--s-panel); border: 1px solid var(--s-line); border-radius: 4px; padding: 3px 7px; color: var(--s-fg); min-height: 0; font: inherit; line-height: 1.15; white-space: nowrap; flex: 0 0 auto; }
  #legend button { cursor: pointer; pointer-events: auto; }
  #legend button.off { opacity: .45; text-decoration: line-through; }
  #legend i { display: inline-block; width: 12px; height: 10px; margin-right: 4px; vertical-align: -1px; border-radius: 2px; }
  #dock { position: absolute; left: 8px; right: 8px; bottom: 8px; display: flex; flex-direction: column; align-items: flex-start; gap: 6px; pointer-events: none; max-height: calc(100% - 60px); }
  #dock > * { pointer-events: auto; max-width: 100%; }
  #pstate { font-size: 13px; font-weight: 700; padding: 4px 10px; border-radius: 6px; color: #fff; display: none; }
  .spanel { background: var(--s-panel); border: 1px solid var(--s-line); border-radius: 6px; padding: 6px 8px; color: var(--s-fg); }
  .spanel .lab { font-size: 10.5px; letter-spacing: 1.2px; font-weight: 700; color: var(--s-dim); }
  .spanel button { min-height: 32px; padding: 3px 9px; font-size: 12.5px; border-radius: 4px; background: var(--s-panel2); border-color: var(--s-line); color: var(--s-fg); }
  .spanel button.on { background: var(--s-accent); border-color: var(--s-accent); color: #08121f; font-weight: 600; }
  .spanel .mono { font-family: "JetBrains Mono", "SF Mono", Consolas, monospace; font-size: 12px; color: #cfe0f2; }
  #viewtools { display: flex; flex-direction: column; gap: 6px; }
  #viewtools .row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  #viewtools .seg { display: flex; gap: 2px; }
  #viewtools input[type=range] { flex: 1; min-width: 140px; accent-color: var(--s-accent); margin: 0; }
  #inspect { position: absolute; top: 40px; right: 8px; width: min(380px, calc(100% - 16px)); overflow-y: auto; max-height: calc(100% - 190px); }
  #inspect.empty { width: auto; }
  #inspect .ihead { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  #inspect .ititle { font-weight: 700; font-size: 14px; flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere; }
  #inspect select { font: inherit; font-size: 13px; max-width: 100%; background: var(--s-panel2); color: var(--s-fg); border: 1px solid var(--s-line); border-radius: 4px; min-height: 32px; }
  #inspect .badge { font-size: 10px; font-weight: 700; letter-spacing: .6px; padding: 1px 5px; border-radius: 3px; border: 1px solid var(--s-line); color: var(--s-dim); }
  #inspect .badge.PRODUCED { color: #8fb5d9; border-color: #2f5d8c; } #inspect .badge.PURCHASED { color: #d6b6ff; border-color: #7654a8; } #inspect .badge.REFERENCE { color: #aab3c2; border-style: dashed; }
  #inspect .badge.CHANGED, #inspect .badge.ADDED { color: #8ee0aa; border-color: #1f9d55; } #inspect .badge.REMOVED { color: #ff8a8a; border-color: #d93025; }
  #inspect .dims { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 3px 10px; margin-top: 6px; font-size: 13px; }
  #inspect .dims .k { color: var(--s-dim); }
  #inspect .dims .ch { color: var(--s-accent2); font-weight: 600; }
  #inspect .st { font-size: 10px; color: var(--s-dim); border: 1px solid var(--s-line); border-radius: 3px; padding: 0 3px; margin-left: 4px; }
  #inspect .st.placeholder { color: #ffc244; border-color: #6b5520; }
  #inspect .chips { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 6px; }
  #inspect .chips button { min-height: 28px; font-size: 12px; }
  #inspect .hint { font-size: 12px; color: var(--s-dim); margin-top: 4px; }
  #decision { display: none; background: var(--panel); border-top: 2px solid var(--ok); padding: 6px 12px; gap: 8px; align-items: center; flex-wrap: wrap; }
  #decision.show { display: flex; } #decision.bad { border-top-color: var(--bad); }
  #decision .dtext { flex: 1 1 200px; min-width: 0; font-weight: 600; }
  #decision .dbtns { display: flex; gap: 6px; flex-wrap: wrap; }
  #status { background: var(--bar); color: var(--bar-fg); display: flex; gap: 6px 12px; align-items: center; padding: 6px 12px calc(6px + env(safe-area-inset-bottom)); font-size: 13px; flex-wrap: wrap; }
  #status b { font-weight: 700; } #status .sp { flex: 1; }
  #status button { background: transparent; color: var(--bar-fg); border-color: #555d6b; min-height: 36px; padding: 3px 10px; }
  .tag { padding: 1px 6px; border-radius: 6px; white-space: nowrap; }
  .tag.err { background: var(--bad); } .tag.open { background: var(--open); } .tag.ok { background: #2f6b46; } .tag.prop { background: #3b4352; }
  .sheet { position: fixed; inset: auto 0 0 0; max-height: 85dvh; background: var(--panel); border-top: 1px solid var(--line); border-radius: 14px 14px 0 0; transform: translateY(105%); transition: transform .2s; z-index: 5; display: flex; flex-direction: column; box-shadow: 0 -8px 30px rgba(0,0,0,.2); }
  .sheet.open { transform: none; }
  .sheet header { display: flex; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line); } .sheet h2 { font-size: 16px; margin: 0; flex: 1; }
  .sheet .body { overflow-y: auto; padding: 8px 16px calc(12px + env(safe-area-inset-bottom)); }
  @media (min-width: 761px) { .sheet { inset: 0 0 0 auto; width: 440px; max-height: none; border-radius: 0; transform: translateX(105%); } }
  .rev { border-bottom: 1px solid var(--line); padding: 8px 0; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px; align-items: start; }
  .rev.cur { font-weight: 600; } .rev.off { opacity: .7; }
  .exp { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; border-bottom: 1px solid var(--line); padding: 8px 0; }
  .formgrid { display: grid; grid-template-columns: minmax(120px, max-content) minmax(0, 1fr); gap: 8px 12px; align-items: center; }
  .formgrid input, .formgrid select { width: 100%; min-width: 0; font: inherit; font-size: 16px; padding: 7px 9px; border-radius: 7px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); }
  .sheet-actions { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0; }
  .newproduct label { display: block; font-weight: 600; margin-bottom: 4px; }
  .newproduct .np { display: flex; gap: 8px; }
  .newproduct input, .pform input { flex: 1; min-width: 0; width: 100%; font: inherit; font-size: 16px; padding: 8px 10px; min-height: 44px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); }
  .product { border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; margin: 0 0 8px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 8px; align-items: center; }
  .product.current { border-color: var(--accent); box-shadow: inset 4px 0 0 var(--accent); }
  .product .pname { font-weight: 600; overflow-wrap: anywhere; }
  .product .pactions { display: flex; gap: 6px; }
  .product .pactions button, .pform button, .newproduct button { min-height: 44px; }
  .product .pform { grid-column: 1 / -1; border-top: 1px dashed var(--line); padding-top: 8px; }
  .product .pform label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  .product .confirm p { margin: 4px 0; font-size: 14px; }
  button.danger { background: var(--bad); border-color: var(--bad); color: #fff; font-weight: 600; }
  #toggle3d { display: none; }
  @media (max-width: 760px) {
    main { grid-template-columns: minmax(0, 1fr); }
    #stage { display: none; } body.show3d #stage { display: block; } body.show3d #chat { display: none; }
    #inspect { top: 44px; left: 8px; right: 8px; width: auto; max-height: 36%; padding: 4px 8px; }
    #inspect .dims { font-size: 12.5px; gap: 1px 8px; }
    #legend { flex-wrap: nowrap; overflow-x: auto; overflow-y: hidden; font-size: 10.5px; pointer-events: auto; scrollbar-width: none; gap: 4px; }
    #legend::-webkit-scrollbar { display: none; }
    #legend > * { flex: 0 0 auto; white-space: nowrap; }
    #toggle3d { display: inline-block; }
    #status { font-size: 12px; } #status .sp { display: none; }
    #decision { padding: 4px 8px; gap: 4px; }
    #decision .dtext { flex-basis: 100%; font-size: 13px; }
    #decision .dbtns { flex-wrap: nowrap; width: 100%; }
    #decision button { flex: 1 1 0; min-width: 0; padding: 4px 6px; white-space: nowrap; }
    #decision .long { display: none; } #decision .short { display: inline; }
    #chips { display: none; } body.nochips #chips { display: none; } #composer { padding: 6px 8px; }
    .rows { grid-template-columns: minmax(0, 1fr); } .why { grid-column: 1; }
    .choices button { flex: 1 1 100%; }
    .product { grid-template-columns: minmax(0, 1fr); }
    .product .pactions button { flex: 1 1 0; }
  }
</style>
<script type="importmap">{ "imports": { "three": "../vendor/three/three.module.min.js?v=fc0aae918fa8" } }</script>
</head>
<body>
<main>
  <section id="chat" aria-label="Conversation">
    <header><h1>Concept Sketcher</h1><span class="muted" id="modeLabel" data-boot="static">Starting…</span></header>
    <div id="log" aria-live="polite"></div>
    <div id="composer">
      <div id="chips"></div>
      <form id="form"><button type="button" id="examplesBtn" title="Example sentences">＋</button><input id="input" autocomplete="off" placeholder="Describe the change in your own words…" aria-label="Message"><button class="primary" type="submit">Send</button></form>
    </div>
  </section>
  <section id="stage" aria-label="3D preview">
    <div id="view"></div>
    <div id="legend">
      <button type="button" id="legendRef" aria-pressed="true" title="Hide or show REFERENCE geometry"><i style="background:rgba(127,159,189,.22);border:1px dashed #c6d9ea"></i>REFERENCE</button>
      <span title="Proposed change"><i style="background:#1f9d55"></i>+ PROPOSED</span>
      <span title="Removed by proposal"><i style="background:none;border:2px dashed #d93025"></i>− REMOVED</span>
      <span title="Open / unresolved"><i style="background:none;border:2px dashed #e8730c"></i>? OPEN</span>
    </div>
    <div id="inspect" class="spanel" aria-label="Inspect dimensions"></div>
    <div id="dock">
      <div id="pstate"></div>
      <div id="viewtools" class="spanel" aria-label="View tools (view only, never saved into the concept)"></div>
    </div>
  </section>
</main>
<div id="decision" role="region" aria-label="Pending proposal"></div>
<footer id="status" aria-label="Accepted concept state"></footer>
<aside id="history" class="sheet" aria-label="Accepted revisions"><header><h2>Accepted revisions</h2><button id="closeHist" type="button">Close</button></header><div class="body" id="revs"></div></aside>
<aside id="exports" class="sheet" aria-label="Export"><header><h2>Export accepted concept</h2><button id="closeExp" type="button">Close</button></header><div class="body" id="expList"></div></aside>
<aside id="projects" class="sheet" aria-label="Products"><header><h2>Products</h2><button id="closeProjects" type="button">Close</button></header><div class="body" id="projectList"></div></aside>
<aside id="properties" class="sheet" aria-label="Exact properties"><header><h2>Exact properties</h2><button id="closeProperties" type="button">Close</button></header><div class="body" id="propertyList"></div></aside>
<input id="openFile" type="file" accept=".aiconcept,application/json" hidden>
<script type="module" src="app.js?v=fc0aae918fa8"></script>
</body>
</html>
