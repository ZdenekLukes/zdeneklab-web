    d.postCorners.forEach(function (c) {
      if (c[1] < 0) {                                          /* the front posts tie into the cradle wall */
        var L = Math.hypot(c[0], c[1]), ux = c[0]/L, uy = c[1]/L;
        var ax = ux*(d.baseR - 0.8), ay = uy*(d.baseR - 0.8), w = Math.max(4.0, p.base_wall_thickness*1.6), nx = -uy*w/2, ny = ux*w/2;
        addExtruded(M, g, [[ax+nx,ay+ny],[c[0]+nx,c[1]+ny],[c[0]-nx,c[1]-ny],[ax-nx,ay-ny]], null, 0, d.cradleH, XF.XY(0), "radial base web");
      }
      addExtruded(M, g, roundRect2(c[0], c[1], p.post_width, p.post_depth, p.post_corner_radius, 4),
                  null, 0, d.baseTop, XF.XY(0), "post pedestal");
    });

    /* --- the two rails.  One XZ profile - rib, 45 degree corbel, bearing, side guide - run along Y. --- */
    d.rails.forEach(function (r) {
      var sg = r.sign, yEnd = r.y1, yMain = yEnd - R.lead;
      var zc = R.rootZ - 2;                                     /* the solid band the corbel grows out of starts here */
      function prof(top, guide) {                               /* top = how far below the bearing plane this section stops */
        var zt = S - top, xt = R.inner + top, P = [[R.rib0, zc], [R.rib1, zc], [R.rib1, zt]];
        if (guide) P.push([R.face + d.ribT, zt], [R.face + d.ribT, zt + p.mac_guide_height], [R.face, zt + p.mac_guide_height], [R.face, zt]);
        P.push([xt, zt], [xt, zt - R.tip], [R.rib0, R.rootZ]);
        return P.map(function (v) { return [sg*v[0], v[1]]; });
      }
      var gOn = p.mac_guide_height > 0.05, yG = gOn ? yMain - R.funnel : yMain;
      addExtruded(M, g, prof(0, gOn), null, 0, yG - r.y0, XF.XZ(yG), "Mac rail " + r.id);
      if (gOn) {
        /* the guide ends in a funnel: the Mac may arrive 2.4 mm off-line and is steered in, not caught */
        addExtruded(M, g, prof(0, false), null, 0, R.funnel, XF.XZ(yMain), "Mac rail " + r.id + " funnel zone");
        addExtruded(M, g, [[sg*R.face, yG], [sg*(R.face + d.ribT), yG], [sg*(R.face + d.ribT), yMain]], null,
                    S, S + p.mac_guide_height, XF.XY(0), "Mac rail " + r.id + " guide funnel");
      }
      /* rear lead-in: the last 2 mm stop 2 mm lower and a 45 degree wedge brings the Mac's front edge up */
      addExtruded(M, g, prof(R.lead, false), null, 0, R.lead, XF.XZ(yEnd), "Mac rail " + r.id + " end");
      addExtruded(M, g, [[-yMain, S - R.lead], [-yMain, S], [-yEnd, S - R.lead]], null, 0, R.face + d.ribT - R.inner,
                  XF.YZ(sg > 0 ? R.face + d.ribT : -R.inner), "Mac rail " + r.id + " lead-in");
      /* below that band the rib is a row of 45 degree arches from the bed: it only has to carry the band */
      var aw = 24, n = Math.max(0, Math.floor((yEnd - r.y0 - 8) / (aw + 6))), gap = (yEnd - r.y0 - n*aw) / (n + 1), lower = [[r.y0, 0]], k;
      for (k = 0; k < n; k++) {
        var c0 = r.y0 + gap*(k + 1) + aw*k, zs = Math.max(0.5, zc - 1.5 - aw/2);
        lower.push([c0, 0], [c0, zs], [c0 + aw/2, zs + aw/2], [c0 + aw, zs], [c0 + aw, 0]);
      }
      lower.push([yEnd, 0], [yEnd, zc + 0.5], [r.y0, zc + 0.5]);
      addExtruded(M, g, lower.map(function (q) { return [-q[0], q[1]]; }), null, 0, d.ribT,
                  XF.YZ(sg > 0 ? R.rib1 : -R.rib0), "Mac rail " + r.id + " rib arches");
      /* front stop, on the rail */
      if (p.mac_front_stop_height > 0.05)
        addBox(M, g, Math.min(sg*R.inner, sg*(R.face + d.ribT)), Math.max(sg*R.inner, sg*(R.face + d.ribT)),
                     r.y0, r.y0 + R.stopT, S, S + p.mac_front_stop_height);
      /* the rib runs on from post to post; past the rail it is only as high as the cradle wall,
         so on the left it stays under the power keep-out */
      addBox(M, g, Math.min(sg*R.rib0, sg*R.rib1), Math.max(sg*R.rib0, sg*R.rib1), -d.postY, r.y0 + 0.5, 0, d.baseTop);
      addBox(M, g, Math.min(sg*R.rib0, sg*R.rib1), Math.max(sg*R.rib0, sg*R.rib1), yEnd - 0.5, d.postY, 0, d.baseTop);
    });

    /* --- four upper anti-lift tabs.  The side guide continues upward as a pillar; from the guide face a short flat
       lip (3 mm: a cantilever that prints flat) reaches in over the Mac's top edge at exactly the anti-lift clearance,
       so the catch height does not depend on where the Mac sits in its side play.  The lip's rear end is one 45
       degree plane leaning back over its whole height: a Mac arriving high is pushed down, never caught. --- */
    var AL = d.antiLift;
    AL.tabs.forEach(function (t) {
      var sg = t.sign, xF = sg*AL.xFace, xP = sg*(AL.xFace + AL.pillar), xT = sg*(AL.xFace - AL.reach), y0 = t.y[0], y1 = t.y[1];
      addBox(M, g, Math.min(xF, xP), Math.max(xF, xP), y0, y1 - AL.slope, S, AL.zBase);            /* pillar below the lip */
      /* lip + pillar top as one convex loft.  The guide-face vertex sits on the collinear bottom edge and is
         listed FIRST, so the cap fans radiate from it and its edges match the pillar box below - no T-junction.
         The order is chosen per side so the volume is already positive and addLoft never re-orders it. */
      var base = [[AL.xFace, AL.zBase], [AL.xFace - AL.reach, AL.zBase], [AL.xFace - AL.reach, AL.zTop], [AL.xFace + AL.pillar, AL.zTop], [AL.xFace + AL.pillar, AL.zBase]];
      var prof = (sg > 0 ? base : [base[0]].concat(base.slice(1).reverse())).map(function (q) { return [sg*q[0], q[1]]; });
      var front = prof.map(function (q) { return [q[0], y0, q[1]]; });
      var rear  = prof.map(function (q) { return [q[0], y1 - (AL.zTop - q[1]), q[1]]; });       /* the leaning rear cap */
      addLoft(M, g, [front, rear]);
    });
    /* --- retainer ears: a slab on the front face of each rear post, within the post's own X footprint so the
       ballast still passes between the posts.  Left ear: a locating pin.  Right ear: a captive M3 nut. --- */
    var RT = d.retainer;
    d.postCorners.forEach(function (c) {
      if (c[1] < 0) return;
      var sg = c[0] > 0 ? 1 : -1, x0 = Math.min(sg*RT.earX[0], sg*RT.earX[1]), x1 = Math.max(sg*RT.earX[0], sg*RT.earX[1]);
      if (sg < 0) {
        addBox(M, g, x0, x1, RT.earY[0], RT.earY[1], 0, RT.earTop);
        addCyl(M, g, RT.pin.at[0], RT.pin.at[1], RT.earTop, RT.pin.z[1], RT.pin.diameter/2, 0, 24);
      } else {
        var sq = RT.screw, nz = sq.nut.z, cx = sq.at[0], cy = sq.at[1], hw = sq.nut.slotWidth/2;
        addBox(M, g, x0, x1, RT.earY[0], RT.earY[1], 0, nz[0]);
        addBox(M, g, x0, cx - hw, RT.earY[0], RT.earY[1], nz[0], nz[1]);          /* the nut slot: open to the front, */
        addBox(M, g, cx + hw, x1, RT.earY[0], RT.earY[1], nz[0], nz[1]);          /* its ceiling is a 6.8 mm bridge */
        addExtruded(M, g, rect2((x0 + x1)/2, (RT.earY[0] + RT.earY[1])/2, x1 - x0, RT.earY[1] - RT.earY[0]),
                    [circle2(cx, cy, sq.pilot/2, 16)], nz[1], RT.earTop, XF.XY(0), "retainer ear pilot");
      }
    });

    if (p.lower_cage_height > 0.05)
      d.postCorners.forEach(function (c) {
        addExtruded(M, "neckbase_posts",
          roundRect2(c[0], c[1], p.post_width, p.post_depth, p.post_corner_radius, 4),
          null, d.baseTop, d.postTop, XF.XY(0), "neck post");
      });

    if (d.shell) {
      var sh = d.shell, SG = "neckbase_shell", H = sh.H;
      function trapezoid(hb, ht) { return [[-hb, 0], [hb, 0], [ht, H], [-ht, H]]; }
      function mirrorU(list) { return list.map(function (h) { return h.map(function (v) { return [-v[0], v[1]]; }); }); }
      /* sheared extrusions: the wall thickness is horizontal, so foot and rim stay flat on z = 0 and z = H */
      function pts(list) { return list.map(function (o) { return o.pts; }); }
      addExtruded(M, SG, trapezoid(sh.Yb, sh.top), sh.cellsRight.concat(pts(sh.nutPorts.right)), 0, sh.twx,
                  function (u, z, w) { return [(sh.Xb - sh.twx) - sh.kx*z + w, u, z]; }, "shell right honeycomb");
      addExtruded(M, SG, trapezoid(sh.Yb, sh.top), mirrorU(sh.cellsLeft.concat([sh.finger.pts], pts(sh.nutPorts.left))), 0, sh.twx,
                  function (u, z, w) { return [-((sh.Xb - sh.twx) - sh.kx*z + w), -u, z]; }, "shell left honeycomb");
      addExtruded(M, SG, trapezoid(sh.Xb, sh.top), sh.cellsFront.concat(pts(sh.nutPorts.front)), 0, sh.twy,
                  function (u, z, w) { return [u, -((sh.Yb - sh.twy) - sh.ky*z + w), z]; }, "shell front honeycomb");
      [1, -1].forEach(function (sx) {
        addExtruded(M, SG, [[-sx*sh.returnX, 0], [-sx*sh.Xb, 0], [-sx*sh.top, H], [-sx*sh.returnX, H]],
                    sh.cellsReturn.map(function (h) { return h.map(function (q) { return [-sx*q[0], q[1]]; }); }), 0, sh.twy,
                    function (u, z, w) { return [-u, (sh.Yb - sh.twy) - sh.ky*z + w, z]; }, "shell rear return");
        /* tie the thin wall to the posts: a 45 degree gusset from each post, in the post's own XZ plane */
        var xo = d.postX + p.post_width/2 - 1.0, z1 = sh.gussetZ, GT = sh.gussetTop, xwTop = (sh.Xb - sh.twx) - sh.kx*GT + 0.5;
        var zk = (z1 + (sh.Xb - sh.twx) + 0.5 - xo) / (1 + sh.kx), xk = (sh.Xb - sh.twx) + 0.5 - sh.kx*zk;
        [1, -1].forEach(function (sy) {
          addExtruded(M, SG, [[sx*xo, z1], [sx*xk, zk], [sx*xwTop, GT], [sx*xo, GT]], null, 0, 2.0,
                      XF.XZ(sy*d.postY + 1.0), "shell gusset");
        });
      });
    }

    d.postCorners.forEach(function (c, i) {
      var J = "neckbase_joint", so = p.joint_screw_offset, ang = d.screwAng[i], hwR = d.boltRelief/2;
      var bore = function () { return [circle2(d.screwPos[i][0], d.screwPos[i][1], p.joint_screw_pilot/2, 14)]; };
      if (!d.screws) {
        if (d.padH > 0.05) addExtruded(M, J, circle2(c[0], c[1], d.padR, 24), null, d.seatZ - d.padH, d.seatZ, XF.XY(0), "seat pad");
      } else {
        /* 45 degree flare as steps, so the bolt relief can be cut through it: the bolt runs free
           below the nut, beside the post, whatever standard length is used */
        var n = d.flareN, k;
        for (k = 0; k < n; k++) {
          var r = d.postR0 + d.flareH*(k+1)/n, z0 = d.postTop + d.flareH*k/n, z1 = d.postTop + d.flareH*(k+1)/n;
          addExtruded(M, J, r > so - hwR + 0.4 ? notchedCircle2(c[0], c[1], r, ang, so - hwR, hwR, 24)
                                               : circle2(c[0], c[1], r, 24), null, z0, z1, XF.XY(0), "pad flare " + k);
        }
        addExtruded(M, J, notchedCircle2(c[0], c[1], d.padR, ang, so - hwR, hwR, 24), null,
                    d.seatZ - d.padH, d.nutZ0, XF.XY(0), "nut floor");
        addExtruded(M, J, notchedCircle2(c[0], c[1], d.padR, ang, so - d.nut.slotBack, d.nut.slotWidth/2, 24), null,
                    d.nutZ0, d.nutZ1, XF.XY(0), "nut slot");
        addExtruded(M, J, circle2(c[0], c[1], d.padR, 24), bore(), d.nutZ1, d.seatZ, XF.XY(0), "nut land");
      }
      if (p.joint_engagement > 0.05 && d.spigotR > 0.1)
        addCyl(M, "neckbase_joint", c[0], c[1], d.seatZ, d.seatZ + p.joint_engagement,
               d.spigotR, 0, 24);
    });
  },

  buildRefs: function (M, p, ctx, d) {
    /* Contract v2: the ballast is drawn from its own (declarative) component document */
    buildComponentInto(M, BALLAST_WEIGHT_V2, { z0: d.cavityZ0, outerDiameter: p.weight_diameter, height: p.weight_height, boreDiameter: 30 });
    /* The Mac is built by its own reference builder from the shared layout.  A bound Library Mac
       that passed the rule above replaces the enclosure only; the service volumes are holder rules. */
    if (d.macExternal) addStaticMesh(M, "ref_mac", d.macExternal.mesh, 0, 0, d.macZ0);
    buildComponentInto(M, MAC_MINI_V2, { layout: d.macLayout, body: !d.macExternal, service: true });
  },

  validate: function (p, ctx, d, err, warn, f, env) {
    if (d.macIgnored)
      warn("Library Mac mini '" + d.macIgnored.name + "' (" + d.macIgnored.accuracy + " / " + d.macIgnored.status + ") is IGNORED because " +
           d.macIgnored.why + ". The built-in Mac mini M4 reference V" + MAC_MINI_M4.version + " stays in charge.");
    if (d.macFitRaised.some(function (v) { return v > 1e-9; }))
      warn("Mac fit envelope raised to Apple's nominal " + MAC_MINI_M4.official.nominalEnvelope.join(" x ") + " mm (by " +
           d.macFitRaised.map(f).join(" / ") + " mm): a holder must never be sized below the published body.");
    if (p.base_floor_thickness < p.min_wall - 1e-9)
      err(["base_floor_thickness"], "Weight shelf " + f(p.base_floor_thickness) +
          " is below min wall " + f(p.min_wall) + ".");
    if (p.base_wall_thickness < p.min_wall - 1e-9)
      err(["base_wall_thickness"], "Cradle wall " + f(p.base_wall_thickness) +
          " is below min wall " + f(p.min_wall) + ".");
    /* --- rear-loaded ballast --- */
    if (2*d.postInnerX < p.weight_diameter + 1 - 1e-9)
      err(["open_side_margin","weight_diameter"], "The rear posts stand " + f(2*d.postInnerX) + " mm apart: the flat " +
          f(p.weight_diameter) + " mm ballast cannot pass between them.");
    if (!(p.ballast_drop > 0))
      err(["ballast_drop"], "Ballast seat drop is " + f(p.ballast_drop) + ": nothing would keep the ballast from sliding back out.");
    if (d.railOverBallastWorst < 1.0 - 1e-9)
      err(["mac_support_height","ballast_drop","mac_support_bearing","ballast_side_clearance"], "Only " + f(d.railOverBallastWorst) +
          " mm between the ballast riding the threshold hard against a rib and the Mac rail above it; it needs 1.0.");
    if (d.weightShelfR >= d.weightR - 1e-9)
      err(["weight_diameter"], "The shelf ring does not reach under the ballast: it would fall through.");
    /* --- two-rail Mac holder --- */
    if (p.mac_clearance_xy < 0.5 - 1e-9 || p.mac_clearance_xy > 1.2 + 1e-9)
      warn("Mac side clearance " + f(p.mac_clearance_xy) + " mm is outside 0.5 - 1.2: tighter needs aiming, looser lets the Mac wander off its USB-C cells.");
    if (p.mac_support_bearing - p.mac_clearance_xy < 6 - 1e-9)
      warn("With the Mac pushed to one side only " + f(p.mac_support_bearing - p.mac_clearance_xy) + " mm of it rests on the other rail.");
    if (d.rail.inner < d.macFootD/2 + 1 - 1e-9)
      err(["mac_support_bearing"], "The rails reach x " + f(d.rail.inner) + ": the Mac's raised underside (dia " +
          f(d.macFootD) + ") sweeps |x| <= " + f(d.macFootD/2) + " on its way in.");
    if (d.rails[0].y1 > d.powerKeepout[1] + 1e-9)
      err(["mac_support_bearing"], "The left rail runs into the rear-left power-access keep-out.");
    if (d.rail.rootZ < d.baseTop - 1e-9)
      warn("The rail corbel leaves its rib below the cradle top (" + f(d.rail.rootZ) + "): on the left it dips into the zone under the power corner.");
    if (!(p.mac_front_stop_height > 0))
      err(["mac_front_stop_height"], "Without a front stop the Mac slides through to the front panel.");
    /* --- capture --- */
    if (d.antiLift.zTop > d.seatZ - 1 + 1e-9)
      err(["lower_cage_height","mac_support_height"], "The anti-lift tabs reach z " + f(d.antiLift.zTop) + ", up to the Shoulder seat plane.");
    d.antiLift.tabs.forEach(function (t) {
      var nearPad = d.postCorners.some(function (c) {
        var dx = Math.max(t.x[0] - c[0], 0, c[0] - t.x[1]), dy = Math.max(t.y[0] - c[1], 0, c[1] - t.y[1]);
        return Math.hypot(dx, dy) < d.padR + 1; });
      if (nearPad && d.antiLift.zTop > d.seatZ - d.padH - 1 + 1e-9)
        err(["lower_cage_height"], "Anti-lift tab " + t.id + " stands under a joint pad and reaches into it.");
    });
    if (d.antiLift.tabs.some(function (t) { return t.side === "LEFT" && t.y[1] > d.rails[0].y1 - d.rail.lead + 1e-9; }))
      err(["mac_support_bearing"], "A left anti-lift tab stands where the left rail was cut for the power keep-out.");
    if (d.retainer.bar.z[1] > d.retainer.lowestCableZ - 0.3 + 1e-9)
      err(["mac_support_height"], "The rear retainer bar (top z " + f(d.retainer.bar.z[1]) + ") reaches into the lowest cable path (z " + f(d.retainer.lowestCableZ) + ").");
    if (d.retainer.side.xInner < d.retainer.widestCableX + 1 - 1e-9)
      err(["mac_width"], "The retainer's tall side blocks start at |x| " + f(d.retainer.side.xInner) + ", inside the widest cable path (" + f(d.retainer.widestCableX) + ").");
    if (d.retainer.earX[0] < d.weightR + p.ballast_side_clearance - 1e-9)
      err(["post_width"], "The retainer ears reach x " + f(d.retainer.earX[0]) + ": the ballast could not pass between the rear posts.");
    if (d.retainer.screw.nut.land < 3 - 1e-9)
      err(["mac_support_height"], "Only " + f(d.retainer.screw.nut.land) + " mm of PLA above the retainer's captive nut; it needs 3.");
    if (d.retainer.bar.y[1] - d.retainer.bar.y[0] < 3)
      err(["post_depth","mac_depth"], "Only " + f(d.retainer.bar.y[1] - d.retainer.bar.y[0]) + " mm between the seated Mac and the rear posts: no room for the retainer bar.");
    if (d.padOverMac < 1 - 1e-9)
      err(["lower_cage_height","mac_support_height"], "Only " + f(d.padOverMac) + " mm between the Mac sliding in and the joint pad over its corner.");
    if (!d.macCentreInside)
      err(["mac_support_bearing"], "The Mac centre is outside its support polygon: it would tip.");
    else if (d.macStabilityMargin < 12)
      warn("The Mac centre sits only " + f(d.macStabilityMargin) + " mm inside its support polygon.");
    if (d.macFootD <= 0 || d.macFootD >= Math.min(d.macW, d.macD))
      err(["mac_width","mac_depth"], "Measured Mac underside diameter " + f(d.macFootD) +
          " is incompatible with the " + f(d.macW) + " x " + f(d.macD) + " envelope.");
    if (p.mac_support_bearing > d.macOuterBand - 0.5 + 1e-9)
      err(["mac_support_bearing"],
          "Mac support bears " + f(p.mac_support_bearing) + " mm inward, but the measured Ø" +
          f(d.macFootD) + " underside leaves only " + f(d.macOuterBand) +
          " mm from the case edge to the raised centre. Leave at least 0.5 mm margin.");
    if (p.mac_foot_height > p.mac_support_height - 3)
      err(["mac_foot_height","mac_support_height"],
          "The raised underside region (" + f(p.mac_foot_height) + ") leaves under 3 mm above the ballast cradle.");
    if (p.mac_support_height < 10)
      warn("Mac underside service gap is only " + f(p.mac_support_height) +
           " mm. Keep about 10 mm or more for airflow and power-button access.");
    var macNeeds = p.mac_support_height - p.mac_foot_height + d.macH + p.mac_clearance_z;
    if (p.lower_cage_height < macNeeds - 1e-9)
      err(["lower_cage_height","mac_height","mac_support_height","mac_foot_height","mac_clearance_z"],
          "Lower cage too short for the Mac mini: needs " + f(macNeeds) + ", has " + f(p.lower_cage_height) + ".");
    /* --- honeycomb shell --- */
    if (d.shell) {
      var sh = d.shell;
      if (2*sh.Xb > p.bed_size_x + 1e-9 || 2*sh.Yb > p.bed_size_y + 1e-9)
        err(["shoulder_shell_lower_width","shoulder_shell_lower_depth"], "Shell " + f(2*sh.Xb) + " x " + f(2*sh.Yb) +
            " does not fit the bed (" + f(p.bed_size_x) + " x " + f(p.bed_size_y) + "). Make the shell smaller, not the bed larger.");
      if (p.shoulder_shell_wall < p.min_wall - 1e-9)
        warn("Shell wall " + f(p.shoulder_shell_wall) + " is below min wall; " + f(sh.wall) + " is used.");
      if (Math.max(sh.leanX, sh.leanY) > 45 + 1e-9)
        err(["shoulder_shell_lower_width","shoulder_shell_lower_depth"], "The shell leans " + f(Math.max(sh.leanX, sh.leanY)) +
            " degrees: over 45 it cannot print without support.");
      if (2*sh.returnX < Math.max(p.weight_diameter, d.macW) + 2)
        err(["post_width"], "The shell's rear opening is " + f(2*sh.returnX) + " mm: the ballast and the Mac do not fit through it.");
      d.macIO.rear.ports.forEach(function (q) {
        var b=q.cableBox, margin=1.0;
        if (b[0] < -sh.returnX + margin || b[3] > sh.returnX - margin)
          err(["post_width","mac_width"], q.id + " plug envelope x " + f(b[0]) + " .. " + f(b[3]) +
              " does not fit the shell's open rear (" + f(-sh.returnX) + " .. " + f(sh.returnX) + ").");
        [-1,1].forEach(function (sx) {
          var x0=sx*d.postX-p.post_width/2, x1=sx*d.postX+p.post_width/2;
          if (b[3] > x0 + margin && b[0] < x1 - margin)
            err(["post_width","mac_width"], q.id + " straight cable path overlaps the " + (sx<0 ? "left" : "right") + " rear post.");
        });
      });
      if (Math.min(sh.cellsFront.length, sh.cellsLeft.length, sh.cellsRight.length) < 6)
        err(["shell_cell_width","shell_cell_web"], "A shell panel holds fewer than six cells: that is not a honeycomb.");
      if (sh.cellsFront.length + sh.cellsLeft.length + sh.cellsRight.length > 240)
        warn("Over 240 honeycomb cells: use a few dozen larger cells, not perforation.");
      if (d.screws && sh.nutPorts.front.length + sh.nutPorts.left.length + sh.nutPorts.right.length < 3)
        err(["shoulder_shell_lower_width"], "The shell stands in front of a captive nut's way in and has no port for it.");
      [].concat(sh.nutPorts.front, sh.nutPorts.left, sh.nutPorts.right).forEach(function (o) {
        if (o.z1 > sh.H - sh.cell.web + 1e-9)
          err(["shell_top_lap"], "A nut port's 45 degree roof reaches " + f(o.z1) + ": it needs " + f(sh.cell.web) + " mm of rim above it (rim " + f(sh.H) + ").");
      });
      if (p.shell_top_lap < 2)
        warn("Shell lap " + f(p.shell_top_lap) + " mm gives the next neck skin almost nothing to overlap.");
      if (d.usb.access) d.usb.access.forEach(function (q, i) {
        if (q.plugClearance < 1 - 1e-9)
          err(["shell_cell_width","mac_support_height"], "USB-C port " + (i + 1) + ": a plug has only " + f(q.plugClearance) + " mm in its honeycomb cell.");
        else if (q.toleranceCapacity < Math.max(d.usb.tolerance[0], d.usb.tolerance[1]) - 0.05)
          warn("USB-C port " + (i + 1) + ": its cell absorbs +/- " + f(q.toleranceCapacity) + " mm, less than the +/- " +
               f(Math.max(d.usb.tolerance[0], d.usb.tolerance[1])) + " mm the hand measurement may be off.");
      });
      if (sh.finger.z1 > sh.H - 4)
        err(["shoulder_shell_lower_depth"], "The finger opening's 45 degree roof does not close under the shell rim.");
    }
    if (d.postTop <= d.baseTop + 1e-9)
      err(["lower_cage_height","joint_pad_height","joint_engagement"],
          "The joint eats the whole post: nothing is left between the base top and the seat.");
    /* the spigot stands on the seat pad; without screws the pad is the post itself */
    var seatR = Math.max(d.postR0, d.padR);
    if (p.joint_spigot_diameter + 2*env.minWall > 2*seatR + 1e-9)
      err(["joint_spigot_diameter","post_width","post_depth"],
          "Spigot " + f(p.joint_spigot_diameter) + " leaves less than min wall on a " +
          f(2*seatR) + " seat.");
    if (d.screws) {
      if (p.joint_screw_offset < d.spigotR + p.joint_screw_pilot/2 + env.minWall - 1e-9)
        err(["joint_screw_offset"], "M3 through-bolt at " + f(p.joint_screw_offset) +
            " breaks into the spigot; it needs at least " +
            f(d.spigotR + p.joint_screw_pilot/2 + env.minWall) + ".");
      if (d.nutLand < 3 - 1e-9)
        err(["joint_pad_height","joint_pad_wall"], "Only " + f(d.nutLand) + " mm of PLA is clamped between the " +
            "captive nut and the seat; the pad needs at least 3.");
      if (p.joint_screw_offset - d.boltRelief/2 < d.postReach + 0.2 - 1e-9)
        err(["joint_screw_offset","post_width","post_depth"], "The M3 bolt at " + f(p.joint_screw_offset) +
            " runs into the post below the pad; it needs at least " + f(d.postReach + 0.2 + d.boltRelief/2) + ".");
    } else {
      warn("Joint screws are disabled: the four spigots locate the Shoulder but nothing retains it against lift-off.");
    }
  }
},

/* ========================== NECK SHOULDER ========================= */
/* The transition and the neck column.  It plugs into the Neck Base seat, so its own
   first layer is the seat plane: the column ring and the four sockets start on the
   plate and nothing begins in the air.  The shoulder ribs root on top of the socket
   caps, so the spigot insertion volume in every socket stays clear (Phase 6 repair of
   the rib-through-bore defect the exact CadQuery model exposed). */
{
  id: "neckshoulder", name: "Neck Shoulder", category: "CORE STRUCTURE", version: 1, frame: "base",
  about: "Four sockets on the base seat, four shoulder ribs rooted on the socket caps and sweeping " +
         "inward, and the tapering neck column that carries the servo bay and the bearing crown.",
  color: [0.62, 0.78, 0.92],
  requires: ["NECK_BASE_SHOULDER@1"],
  provides: ["NECK_TOP@1", "SERVO_YAW@1"],
  print: { orientation: "Z+ (seat face on the bed, as modelled)", supports: "NONE",
           transform: "asModelled", supportFree: true,
           note: "Printed on its own seat plane the column ring and the four sockets are first " +
                 "layer; each rib roots on solid material - the top of its socket cap - and leans " +
                 "inward going up, which is an undercut, not an overhang; the service window " +
                 "closes on a 45 degree roof. Do not print it in the assembled stack orientation." },
  groups: ["shoulder_joint", "shoulder_ribs", "shoulder_column"],
  refs: [],
  params: [
    ["transition_height",      "Transition height",          10, 320, 0.1, 120.0],
    ["neck_lower_diameter",    "Neck lower diameter",        20, 260, 0.1,  96.0],
    ["upper_neck_diameter",    "Upper neck diameter",        20, 220, 0.1,  70.0, "", null, ["NECK_TOP@1","SERVO_YAW@1"]],
    ["neck_wall",              "Neck wall thickness",         1,  15, 0.1,   2.4, "", null, ["NECK_TOP@1","SERVO_YAW@1"]],
    ["shoulder_curvature",     "Shoulder curvature 0..1",     0,   1, 0.01,  0.25],
    ["rib_thickness",          "Shoulder rib thickness",      1,  25, 0.1,   3.6],
    ["rib_width",              "Shoulder rib width at top",   2,  50, 0.1,   8.0],
    ["style",                  "Transition style",            0,   0, 0, "Classic", "", STYLES],
    ["joint_fit_clearance",    "Socket fit clearance (dia)",  0,   2, 0.05,  0.30],
    ["joint_seat_clearance",   "Socket depth clearance",      0,   5, 0.05,  0.40],
    ["joint_block_wall",       "Socket wall",                 1,  15, 0.1,   2.5],
    ["joint_screw_bore",       "Screw clearance bore",      1.0,  12, 0.1,   3.4],
    ["servo_bay_z0",           "Servo bay above seat",        0, 300, 0.1,  33.0, "", null, ["SERVO_YAW@1"]],
    ["servo_bay_width",        "Servo bay width  (X)",       10, 200, 0.1,  54.0, "", null, ["SERVO_YAW@1"]],
    ["servo_bay_depth",        "Servo bay depth  (Y)",       10, 200, 0.1,  32.0, "", null, ["SERVO_YAW@1"]],
    ["servo_bay_height",       "Servo bay height (Z)",       10, 250, 0.1,  50.0, "", null, ["SERVO_YAW@1"]],
    ["service_direction",      "Cassette service direction",  0,   0, 0,   "+X", "", DIRS, ["SERVO_YAW@1"]],
    ["service_clearance",      "Service window clearance",    0,  10, 0.05,  1.00, "", null, ["SERVO_YAW@1"]]
  ],

  derive: function (p, ctx) {
    var b = ctx.need("NECK_BASE_SHOULDER@1"), d = {}, i;
    d.seat        = b;
    d.seatZ       = b.seatZ;
    d.postCorners = b.postCentres;
    d.neckTop     = d.seatZ + p.transition_height;
    d.rNeckBot    = p.neck_lower_diameter/2;
    d.rNeckTop    = p.upper_neck_diameter/2;
    /* --- the joint, sized from what the seat publishes ------------- */
    d.socketR     = (b.spigot.diameter + p.joint_fit_clearance)/2;
    d.socketDepth = b.spigot.height + p.joint_seat_clearance;
    d.coneH       = d.socketR;                                  /* 45 degree blind top */
    d.screwR      = b.screws ? p.joint_screw_bore/2 : 0;
    d.screwPos    = b.screws ? b.screws.positions : [];
    d.blockR      = Math.max(d.socketR + p.joint_block_wall, b.postSection.inscribedRadius,
                             b.screws ? b.screws.offset + d.screwR + p.joint_block_wall : 0);
    d.blockH      = d.socketDepth + d.coneH + p.joint_block_wall;
    /* what the M3 bolt clamps: this socket block plus the base pad down to its captive nut */
    d.boltGrip    = b.screws && b.screws.landBelowSeat ? d.blockH + b.screws.landBelowSeat : 0;
    d.coneSteps   = 4;
    /* --- the transition, exactly as before, now measured from the seat --- */
    d.styleP = p.style === "Organic" ? 1 + p.shoulder_curvature*3.0
             : p.style === "Angular" ? 1 + p.shoulder_curvature*0.35
             :                         1 + p.shoulder_curvature*2.0;
    d.ribTaper = p.style === "Organic" ? 1.30 : p.style === "Angular" ? 1.00 : 1.12;
    d.colR  = function (t) {
      t = Math.max(0, Math.min(1, t));
      return d.rNeckTop + (d.rNeckBot - d.rNeckTop) * Math.pow(1-t, d.styleP);
    };
    d.colRz = function (z) { return d.colR((z - d.seatZ) / Math.max(1e-6, p.transition_height)); };
    /* --- the ribs root on top of the socket caps, not on the seat plane: the spigot
       insertion volume stays clear and every rib starts on solid material.  The root
       is the chord of the cap circle at the rib's own half-thickness, so all four
       root corners sit exactly on the cap. --- */
    var rPost = Math.hypot(d.postCorners[0][0], d.postCorners[0][1]);
    d.rPost = rPost;
    d.ribZ0 = d.seatZ + d.blockH;                                /* rib root plane = cap top */
    d.ribH  = d.neckTop - d.ribZ0;
    d.ribHt0 = (p.rib_thickness/2) * d.ribTaper;                /* half-thickness at the root */
    d.ribRootHalf = Math.sqrt(Math.max(0, d.blockR*d.blockR - d.ribHt0*d.ribHt0));
    d.ribZ = function (t) { return d.ribZ0 + Math.max(0, Math.min(1, t)) * d.ribH; };
    var rBotOut = rPost + d.ribRootHalf, rBotIn = rPost - d.ribRootHalf;
    var inset = Math.min(p.neck_wall*0.8, 0.8);
    var colAtRoot = d.colRz(d.ribZ0);
    var extraOut = Math.max(0, rBotOut - colAtRoot - p.rib_width);
    d.ribInnerR = function (t) {
      t = Math.max(0, Math.min(1, t));
      var col = d.colRz(d.ribZ(t)) - inset;
      return col + Math.max(0, rBotIn - (colAtRoot - inset)) * Math.pow(1-t, d.styleP);
    };
    d.ribOuterR = function (t) {
      t = Math.max(0, Math.min(1, t));
      return d.colRz(d.ribZ(t)) + p.rib_width + extraOut * Math.pow(1-t, d.styleP);
    };
    /* the rib's overhang is measured on the faces that actually face downward: the
       inner face where the rib leans inward going up (radius falling), the outer face
       only where it flares outward going up (radius rising).  An inward-leaning outer
       face faces up - an undercut, not an overhang - and does not count. */
    var maxAng = 0, N = 40;
    for (i = 0; i < N; i++) {
      var dz = Math.max(1e-6, d.ribH/N);
      var dIn = d.ribInnerR(i/N) - d.ribInnerR((i+1)/N);      /* > 0: inner face leans in, faces down */
      var dOut = d.ribOuterR((i+1)/N) - d.ribOuterR(i/N);     /* > 0: outer face flares out, faces down */
      maxAng = Math.max(maxAng, Math.atan2(Math.max(0, dIn, dOut), dz)*180/Math.PI);
    }
    d.overhangDeg = maxAng;
    /* --- reserved servo bay + service window in the column wall ---- */
    d.bayZ0 = d.seatZ + p.servo_bay_z0;
    d.bayZ1 = d.bayZ0 + p.servo_bay_height;
    d.winZ0 = d.bayZ0 - p.service_clearance;
    d.winZ1 = d.bayZ1 + p.service_clearance;
    var horiz = (p.service_direction === "+X" || p.service_direction === "-X")
              ? p.servo_bay_depth/2 : p.servo_bay_width/2;
    d.serviceAng = DIR_ANG[p.service_direction];
    d.serviceVec = DIR_VEC[p.service_direction];
    d.winRmin = Math.min(d.colRz(Math.max(d.seatZ, d.winZ0)), d.colRz(Math.min(d.neckTop, d.winZ1)));
    d.winHalfAng = Math.asin(Math.max(0, Math.min(0.999,
                     (horiz + p.service_clearance) / Math.max(1e-6, d.winRmin))));
    d.ribHalfAng = Math.asin(Math.max(0, Math.min(0.999, (p.rib_thickness/2) / Math.max(1e-6, d.winRmin))));
    d.bayBoreR = Math.min(d.colRz(Math.max(d.seatZ, d.bayZ0)), d.colRz(Math.min(d.neckTop, d.bayZ1))) - p.neck_wall;
    d.bayCornerR = Math.hypot(p.servo_bay_width/2, p.servo_bay_depth/2);
    /* --- the window closes on a self-supporting roof: from the opening's top edge on
       the outer skin the wall grows inward on a 45 degree line until it meets the
       bore, so no flat ceiling is left in the air.  The roof height is where that
       line meets the bore (bisection on the skin profile: the skin tapers, so it is
       not exactly one wall thickness) - derived, not chosen. --- */
    d.winTopZ = Math.max(d.seatZ, Math.min(d.winZ1, d.neckTop));  /* the opening's top edge */
    (function () {
      /* g(h) = (45 deg line at w1+h) - (bore at w1+h): the roof line r = ro(w1) - h against
         the bore r = ro(w1+h) - wall.  g falls with h while the skin leans inward less
         than 45 deg; its root is the roof height.  Search up to four walls (the skin
         profile is constant above the neck top, so a roof past the top is still found
         and then refused by validate() as not fitting). */
      var roTop = d.colRz(d.winTopZ), hi = 4*p.neck_wall, lo = 0, k, mid;
      var g = function (h) { return (roTop - h) - (d.colRz(d.winTopZ + h) - p.neck_wall); };
      d.winRoofCloses = g(hi) <= 0;
      if (!d.winRoofCloses) { d.winRoofH = hi; return; }         /* the line never meets the bore: validate() refuses */
      for (k = 0; k < 60; k++) { mid = (lo + hi)/2; if (g(mid) > 0) lo = mid; else hi = mid; }
      d.winRoofH = (lo + hi)/2;
    })();
    d.winRoofSteps = 4;                                          /* the JS mesh steps the chamfer */
    return d;
  },

  mates: function (p, ctx, d) {
    var b = ctx.need("NECK_BASE_SHOULDER@1");
    return b.postCentres.map(function (c, i) {
      return { id: "NECK_JOINT_" + i, with: "NECK_BASE_SHOULDER@1", feature: "NECK_JOINT_" + i,
               kind: "sliding", type: "socket", axis: [0, 0, 1],
               at: [c[0], c[1], b.seatZ], diameter: b.spigot.diameter + p.joint_fit_clearance,
               clearance: p.joint_fit_clearance };
    });
  },

  publish: function (p, ctx, d) {
    return {
      "NECK_TOP@1": {
        origin: [0, 0, d.neckTop], normal: [0, 0, 1], axis: [0, 0, 1],
        outerDiameter: p.upper_neck_diameter,
        boreDiameter: Math.max(0, p.upper_neck_diameter - 2*p.neck_wall),
        wall: p.neck_wall
      },
      "SERVO_YAW@1": {
        origin: [0, 0, d.bayZ0], axis: [0, 0, 1],
        bay: { width: p.servo_bay_width, depth: p.servo_bay_depth, height: p.servo_bay_height },
        z0: d.bayZ0, z1: d.bayZ1,
        maxCornerRadius: d.bayBoreR,
        serviceDirection: p.service_direction, serviceVector: d.serviceVec,
        serviceClearance: p.service_clearance,
        keepout: { note: "nothing else may occupy the bay", z0: d.bayZ0, z1: d.bayZ1 },
        keepouts: [{ id: "SERVO_BAY", forComponent: "cassette",
                     box: [-p.servo_bay_width/2, -p.servo_bay_depth/2, d.bayZ0,
                            p.servo_bay_width/2,  p.servo_bay_depth/2, d.bayZ1],
                     about: "the bay reserved inside the neck for the servo cassette" }]
      }
    };
  },

  build: function (M, p, ctx, d) {
    /* --- sockets: a tube on the seat plane, closed by a stepped 45 degree cone so the
       rib above it never sits over open air, plus the screw clearance bore --- */
    d.postCorners.forEach(function (c, i) {
      var k, z = d.seatZ, holes;
      function screwHole() {
        return d.screwR > 0.05 ? [circle2(d.screwPos[i][0], d.screwPos[i][1], d.screwR, 14)] : [];
      }
      holes = [circle2(c[0], c[1], d.socketR, 24)].concat(screwHole());
      addExtruded(M, "shoulder_joint", circle2(c[0], c[1], d.blockR, 28), holes,
                  z, z + d.socketDepth, XF.XY(0), "socket");
      z += d.socketDepth;
      var dz = d.coneH / d.coneSteps;
      for (k = 1; k <= d.coneSteps; k++) {
        var r = d.socketR * (1 - k/d.coneSteps);
        holes = (r > 0.3 ? [circle2(c[0], c[1], r, 24)] : []).concat(screwHole());
        addExtruded(M, "shoulder_joint", circle2(c[0], c[1], d.blockR, 28), holes,
                    z, z + dz, XF.XY(0), "socket cone " + k);
        z += dz;
      }
      addExtruded(M, "shoulder_joint", circle2(c[0], c[1], d.blockR, 28), screwHole(),
                  z, d.seatZ + d.blockH, XF.XY(0), "socket cap");
    });
    /* --- shoulder ribs, rooted on top of the socket caps --- */
    if (d.ribH > 0.05)
      d.postCorners.forEach(function (c) {
        var th = Math.atan2(c[1], c[0]), ca = Math.cos(th), sa = Math.sin(th), secs = [], k;
        for (k = 0; k <= NRIB; k++) {
          var t = k/NRIB, s = 1-t, z = d.ribZ(t);
          var rO = d.ribOuterR(t), rI = d.ribInnerR(t);
          var ht = (p.rib_thickness/2) * (1 + (d.ribTaper-1)*Math.pow(s, d.styleP));
          secs.push([[rI*ca+ht*sa, rI*sa-ht*ca, z], [rO*ca+ht*sa, rO*sa-ht*ca, z],
                     [rO*ca-ht*sa, rO*sa+ht*ca, z], [rI*ca-ht*sa, rI*sa+ht*ca, z]]);
        }
        addLoft(M, "shoulder_ribs", secs);
      });
    /* --- the column: its bottom ring is this part's first layer --- */
    function colLevels(za, zb, n) {
      var out = [], k;
      for (k = 0; k <= n; k++) {
        var z = za + (zb-za)*k/n, r = d.colRz(z);
        out.push({z:z, ro:r, ri:Math.max(0.05, r - p.neck_wall)});
      }
      return out;
    }
    var w0 = Math.max(d.seatZ, Math.min(d.winZ0, d.neckTop));
    var w1 = Math.max(d.seatZ, Math.min(d.winZ1, d.neckTop));
    var hasWin = w1 - w0 > 0.05;
    var wr = hasWin ? Math.max(w1, Math.min(d.neckTop, w1 + d.winRoofH)) : w1;   /* roof top */
    var roW1 = d.colRz(w1);                                        /* the skin at the opening's top edge */
    if (w0 - d.seatZ > 0.05) addRevolve(M, "shoulder_column", colLevels(d.seatZ, w0, 4), 0, Math.PI*2, SEG);
    if (hasWin)
      addRevolve(M, "shoulder_column", colLevels(w0, w1, NCOL),
                 d.serviceAng + d.winHalfAng, d.serviceAng - d.winHalfAng + Math.PI*2, SEG);
    /* the roof: outside the window the full wall; inside it the wall grows from the
       skin edge at w1 inward along the 45 degree line r = roW1 - (z - w1), which the
       mesh steps in d.winRoofSteps bands (each band filled to the line at its top, never
       past the bore) - stair steps under a 45 degree roof, nothing flat and wide in the air */
    if (hasWin && wr - w1 > 0.05) {
      var kk, nS = d.winRoofSteps;
      var roofRing = function (z, depth) {
        return {z: z, ro: d.colRz(z), ri: Math.max(0.05, d.colRz(z) - p.neck_wall, roW1 - depth)};
      };
      for (kk = 0; kk < nS; kk++) {
        var za = w1 + (wr - w1)*kk/nS, zb = w1 + (wr - w1)*(kk+1)/nS;
        var depth = (wr - w1) * (kk+1)/nS;
        addRevolve(M, "shoulder_column", colLevels(za, zb, 1),
                   d.serviceAng + d.winHalfAng, d.serviceAng - d.winHalfAng + Math.PI*2, SEG);
        addRevolve(M, "shoulder_column", [roofRing(za, depth), roofRing(zb, depth)],
                   d.serviceAng - d.winHalfAng, d.serviceAng + d.winHalfAng, SEG_S);
      }
    }
    if (d.neckTop - wr > 0.05) addRevolve(M, "shoulder_column", colLevels(wr, d.neckTop, 4), 0, Math.PI*2, SEG);
  },

  validate: function (p, ctx, d, err, warn, f, env) {
    var b = ctx.need("NECK_BASE_SHOULDER@1");
    if (p.neck_wall < p.min_wall - 1e-9)
      err(["neck_wall"], "Neck wall " + f(p.neck_wall) + " is below min wall " + f(p.min_wall) + ".");
    if (p.rib_thickness < p.min_wall - 1e-9)
      err(["rib_thickness"], "Shoulder rib " + f(p.rib_thickness) + " is below min wall " + f(p.min_wall) + ".");
    if (p.joint_block_wall < p.min_wall - 1e-9)
      err(["joint_block_wall"], "Socket wall " + f(p.joint_block_wall) + " is below min wall.");
    if (p.upper_neck_diameter - 2*p.neck_wall <= 0.2)
      err(["upper_neck_diameter","neck_wall"], "Upper neck has no bore left.");
    /* --- the joint --- */
    if (p.joint_fit_clearance <= 1e-9)
      err(["joint_fit_clearance"], "A zero socket clearance is an interference fit, not a location.");
    if (d.blockH > p.transition_height - 1e-9)
      err(["transition_height","joint_seat_clearance"],
          "The socket block " + f(d.blockH) + " is taller than the whole transition " +
          f(p.transition_height) + ".");
    if (d.blockR > d.rPost - 1e-9)
      err(["joint_block_wall"], "The socket block reaches the yaw axis; the four blocks would merge.");
    if (d.ribHt0 >= d.blockR - 1e-9)
      err(["rib_thickness","joint_block_wall"],
          "Shoulder rib root " + f(2*d.ribHt0) + " is as thick as the socket cap (" + f(2*d.blockR) +
          ") it has to stand on; the rib would hang past the cap.");
    if (b.screws && d.blockH > b.screws.clearAboveSeat + 1e-9)
      err(["joint_block_wall","joint_seat_clearance"],
          "The socket block is " + f(d.blockH) + " tall but NECK_BASE_SHOULDER v1 only keeps the " +
          "driver path clear from " + f(b.screws.clearAboveSeat) + " above the seat.");
    if (b.screws && p.joint_screw_bore + 1e-9 < (b.screws.throughDiameter || b.screws.pilotDiameter))
      err(["joint_screw_bore"], "M3 shoulder bore " + f(p.joint_screw_bore) +
          " is smaller than the base through bore " +
          f(b.screws.throughDiameter || b.screws.pilotDiameter) + ".");
    if (d.rNeckBot - p.neck_wall <= 0.2)
      err(["neck_lower_diameter","neck_wall"], "Lower neck has no bore left.");
    /* --- servo bay --- */
    if (d.bayZ0 < d.seatZ + 1e-9 || d.bayZ1 > d.neckTop - 1e-9)
      err(["servo_bay_z0","servo_bay_height","transition_height"],
          "Reserved servo bay " + f(d.bayZ0) + " .. " + f(d.bayZ1) +

    ["servo_clearance_y",        "Servo clearance Y / side",   0,  3, 0.05, 0.30],

    ["servo_axis_offset_x",      "Servo axis offset X",      -25, 25, 0.1,  0.0],
    ["servo_axis_offset_y",      "Servo axis offset Y",      -25, 25, 0.1,  0.0],
    ["cassette_z_offset",        "Cassette lift inside bay",   0, 200, 0.1, 0.0],
    ["axis_alignment_tolerance", "Servo / yaw axis tolerance", 0,  5, 0.05, 0.50],

    ["servo_shaft_bore_diameter","Shaft / horn bore",          4, 70, 0.1, 22.0],
    ["cable_clearance",          "Cable space (closed side)",  0, 30, 0.05, 6.0]
  ],
  derive: function (p, ctx) {
    var y = ctx.need("SERVO_YAW@1"), d = {}, w = p.cassette_wall;
    var sv = ctx.ref("yaw_servo");
    d.servoRef = sv;
    d.sw = sv ? sv.envelope.size[0] : p.servo_width;
    d.sd = sv ? sv.envelope.size[1] : p.servo_depth;
    d.sh = sv ? sv.envelope.size[2] : p.servo_height;
    var sx = p.servo_axis_offset_x, sy = p.servo_axis_offset_y;
    d.bay = y.bay; d.bayZ0 = y.z0; d.bayZ1 = y.z1;
    d.serviceDir = y.serviceDirection; d.serviceVec = y.serviceVector;
    d.maxCornerR = y.maxCornerRadius;
    d.servoZ0 = y.z0 + p.cassette_z_offset + w + p.servo_clearance_z;
    d.servoZ1 = d.servoZ0 + d.sh;
    var cav = {
      x0: sx - d.sw/2 - p.servo_clearance_x, x1: sx + d.sw/2 + p.servo_clearance_x,
      y0: sy - d.sd/2 - p.servo_clearance_y, y1: sy + d.sd/2 + p.servo_clearance_y,
      z0: d.servoZ0 - p.servo_clearance_z,            z1: d.servoZ1 + p.servo_clearance_z
    };
    if (d.serviceDir === "+X") cav.x0 -= p.cable_clearance;
    if (d.serviceDir === "-X") cav.x1 += p.cable_clearance;
    if (d.serviceDir === "+Y") cav.y0 -= p.cable_clearance;
    if (d.serviceDir === "-Y") cav.y1 += p.cable_clearance;
    d.cav = cav;
    d.cas = {
      x0: cav.x0 - (d.serviceDir === "-X" ? 0 : w), x1: cav.x1 + (d.serviceDir === "+X" ? 0 : w),
      y0: cav.y0 - (d.serviceDir === "-Y" ? 0 : w), y1: cav.y1 + (d.serviceDir === "+Y" ? 0 : w),
      z0: cav.z0 - w,                               z1: cav.z1 + w
    };
    d.cornerR = Math.max(Math.hypot(d.cas.x0,d.cas.y0), Math.hypot(d.cas.x1,d.cas.y0),
                         Math.hypot(d.cas.x0,d.cas.y1), Math.hypot(d.cas.x1,d.cas.y1));

    addBox(M, "cassette", c.x0, c.x1, c.y0, c.y1, c.z0, c.z0 + w);
    addBox(M, "cassette", c.x0, v.x0, c.y0, c.y1, c.z0, c.z1);
    addBox(M, "cassette", v.x1, c.x1, c.y0, c.y1, c.z0, c.z1);
    addBox(M, "cassette", c.x0, c.x1, c.y0, v.y0, c.z0, c.z1);
    addBox(M, "cassette", c.x0, c.x1, v.y1, c.y1, c.z0, c.z1);
    addExtruded(M, "cassette",
      rect2((c.x0+c.x1)/2, (c.y0+c.y1)/2, c.x1-c.x0, c.y1-c.y0),
      [circle2(d.servoX, d.servoY, p.servo_shaft_bore_diameter/2, 24)],
      v.z1, c.z1, XF.XY(0), "cassette top plate");

  buildRefs: function (M, p, ctx, d) {
    /* Contract v2: the purchased servo draws itself; a bound Library servo replaces its body only. */
    if (d.servoRef && d.servoRef.mesh) addStaticMesh(M, "ref_servo", d.servoRef.mesh, d.servoX, d.servoY, d.servoZ0);
    GENERATORS["servo_yaw@1"](M, { body: !(d.servoRef && d.servoRef.mesh),
                                   x: d.servoX, y: d.servoY, z0: d.servoZ0, z1: d.servoZ1, width: d.sw, depth: d.sd,
                                   shaftRadius: p.servo_shaft_bore_diameter * 0.22, shaftLength: 14 });
  },
  validate: function (p, ctx, d, err, warn, f) {
    var y = ctx.need("SERVO_YAW@1");
    if (p.cassette_wall < p.min_wall - 1e-9)
      err(["cassette_wall"], "Cassette wall " + f(p.cassette_wall) + " is below min wall " + f(p.min_wall) + ".");
    var ow = d.cas.x1 - d.cas.x0, od = d.cas.y1 - d.cas.y0, oh = d.cas.z1 - d.cas.z0;
    if (ow > y.bay.width + 1e-9 || od > y.bay.depth + 1e-9)
      err(["servo_width","servo_depth","cassette_wall","cable_clearance"],
          "Cassette " + f(ow) + " x " + f(od) + " does not fit the bay reserved by SERVO_YAW v1 (" +
          f(y.bay.width) + " x " + f(y.bay.depth) + "). Widen the bay on the Neck or shrink the cassette.");
    if (p.cassette_z_offset + oh > y.bay.height + 1e-9)
      err(["cassette_z_offset","servo_height","cassette_wall"],
          "Cassette is " + f(p.cassette_z_offset + oh) + " tall inside a " + f(y.bay.height) + " bay.");
    if (d.cornerR > y.maxCornerRadius + 1e-9)
      err(["servo_width","servo_depth","cassette_wall"],
          "Cassette corner radius " + f(d.cornerR) + " exceeds the bore radius " +
          f(y.maxCornerRadius) + " published by SERVO_YAW v1.");
    if (d.axisOffset > p.axis_alignment_tolerance + 1e-9)
      err(["servo_axis_offset_x","servo_axis_offset_y","axis_alignment_tolerance"],
          "Servo axis is " + f(d.axisOffset) + " off the yaw axis, tolerance " + f(p.axis_alignment_tolerance) + ".");

    if (y.serviceClearance < 0.3) warn("SERVO_YAW v1 leaves only " + f(y.serviceClearance) + " service clearance.");

    if (d.patternR > d.maxPatternR + 1e-9)

    ["center_fix_offset_y",         "Centre fixing offset Y",  -30,  30, 0.1,  0.0, "", null, ["DRATEK_CRADLE@1"]],
    ["center_fix_tolerance",        "Coaxiality tolerance",      0,   3, 0.05, 0.20]
  ],
  derive: function (p, ctx) {
    var t = ctx.need("CAGE_BASE_TOP@1"), d = {}, bt = p.bracket_plate_thickness;
    d.bracketRef = ctx.ref("dratek_u_bracket");
    d.seatOrigin = t.cradleSeatOrigin;
    d.aperture   = t.centreAperture;
    d.usable     = t.usable;
    d.floorZ0    = t.origin[2];
    d.floorZ1    = d.floorZ0 + p.cradle_floor_thickness;
    d.brLocal = { outerW: p.bracket_inner_width + 2*bt, len: p.bracket_length,
                  total: bt + p.bracket_side_height, t: bt };
    d.brHoleZ = [p.bracket_vertical_pitch_1,
                 p.bracket_vertical_pitch_1 + p.bracket_vertical_pitch_2,
                 p.bracket_vertical_pitch_1 + p.bracket_vertical_pitch_2 + p.bracket_vertical_pitch_3];
    d.brRot = BR_ROT[p.bracket_orientation] || BR_ROT["Upright (opening +Z)"];
    (function () {
      var hx = d.brLocal.outerW/2, hy = d.brLocal.len/2, z1 = d.brLocal.total;
      var lo = [Infinity,Infinity,Infinity], hi = [-Infinity,-Infinity,-Infinity], a, b, c, k;
      for (a = 0; a < 2; a++) for (b = 0; b < 2; b++) for (c = 0; c < 2; c++) {
        var q = d.brRot(a ? hx : -hx, b ? hy : -hy, c ? z1 : 0);
        for (k = 0; k < 3; k++) { if (q[k] < lo[k]) lo[k] = q[k]; if (q[k] > hi[k]) hi[k] = q[k]; }
      }
      d.brBox = { w: hi[0]-lo[0], d: hi[1]-lo[1], h: hi[2]-lo[2], lo: lo, hi: hi };
    })();
    d.cx = d.seatOrigin[0]; d.cy = d.seatOrigin[1];
    d.bracketZ0 = d.floorZ1;
    if (d.bracketRef) {
      /* A measured component brings its own orientation, envelope and hole position.
         Nothing here is guessed any more. */
      var e = d.bracketRef.envelope;
      d.brBox = { w: e.size[0], d: e.size[1], h: e.size[2], lo: e.min, hi: e.max };
      var cf = d.bracketRef.anchor("CENTRE_FIX");
      d.refHole = cf ? [d.cx + cf.origin[0] - (e.min[0] + e.max[0])/2,
                        d.cy + cf.origin[1] - (e.min[1] + e.max[1])/2]
                     : [d.cx, d.cy];
      d.plateOnSeat = true;
      d.holeFromComponent = !!cf;
    } else {
      /* placeholder: the orientation is an assumption, not a measurement */
      var refLocal = d.brRot(0, 0, 0);
      d.plateOnSeat = Math.abs(refLocal[2] - d.brBox.lo[2]) < 1e-6;
      d.refHole = [d.cx, d.cy];
      d.holeFromComponent = false;
    }
    /* The offsets are a correction against the bracket's own hole, so a measured
       component lands coaxial at 0 / 0 without anybody retyping numbers. */
    d.fixHole = [d.refHole[0] + p.center_fix_offset_x, d.refHole[1] + p.center_fix_offset_y];
    d.coax = Math.hypot(p.center_fix_offset_x, p.center_fix_offset_y);
    d.apertureOffset = Math.hypot(d.fixHole[0] - d.aperture.centre[0],
                                  d.fixHole[1] - d.aperture.centre[1]);
    d.seatInnerW = d.brBox.w + 2*p.bracket_insertion_clearance_x;
    d.seatInnerD = d.brBox.d + 2*p.bracket_insertion_clearance_y;
    d.seatW = d.seatInnerW + 2*p.bracket_seat_wall;
    d.seatD = d.seatInnerD + 2*p.bracket_seat_wall;
    d.seatZ1 = d.floorZ1 + p.bracket_seat_depth;
    return d;
  },
  publish: function (p, ctx, d) {
    return { "DRATEK_CRADLE@1": {
      origin: [d.cx, d.cy, d.floorZ1], normal: [0, 0, 1],
      openingAxis: d.brRot(0, 0, 1), uAxis: d.brRot(0, 1, 0),
      seat: { cx: d.cx, cy: d.cy, width: d.seatW, depth: d.seatD, wallHeight: p.bracket_seat_depth },
      bracket: { innerWidth: p.bracket_inner_width, tolerance: p.bracket_width_tolerance,
                 boundingBox: [d.brBox.w, d.brBox.d, d.brBox.h], holeChainZ: d.brHoleZ,
                 source: d.bracketRef ? (d.bracketRef.id + " v" + d.bracketRef.version) : "PLACEHOLDER",
                 accuracy: d.bracketRef ? d.bracketRef.accuracy : "L0",
                 status: d.bracketRef ? d.bracketRef.status : "UNVERIFIED" },
      centreFix: { hole: p.center_fix_hole_diameter, at: d.fixHole, referenceHole: d.refHole,
                   fromComponent: d.holeFromComponent },
      tools: [{ id: "CENTRE_SCREW", origin: [d.fixHole[0], d.fixHole[1], d.floorZ1],
                dir: [0, 0, 1], diameter: Math.max(8, p.center_fix_hole_diameter + 6),
                length: 90, forComponent: "cradle",
                about: "straight screwdriver reach to the single centre fixing" }]
    }};
  },
  build: function (M, p, ctx, d) {
    var g = "cradle", sw = p.bracket_seat_wall;
    var X0 = d.cx - d.seatInnerW/2, X1 = d.cx + d.seatInnerW/2;
    var Y0 = d.cy - d.seatInnerD/2, Y1 = d.cy + d.seatInnerD/2;
    /* seat floor, carrying the single centre fixing hole */
    addExtruded(M, g, rect2(d.cx, d.cy, d.seatW, d.seatD),
                [circle2(d.fixHole[0], d.fixHole[1], p.center_fix_hole_diameter/2, 16)],
                d.floorZ0, d.floorZ1, XF.XY(0), "cradle floor");
    addBox(M, g, X0-sw, X0, Y0-sw, Y1+sw, d.floorZ1, d.seatZ1);
    addBox(M, g, X1, X1+sw, Y0-sw, Y1+sw, d.floorZ1, d.seatZ1);
    addBox(M, g, X0-sw, X1+sw, Y0-sw, Y0, d.floorZ1, d.seatZ1);
    addBox(M, g, X0-sw, X1+sw, Y1, Y1+sw, d.floorZ1, d.seatZ1);
    if (p.bracket_retention_lip > 0.05) {

    if (p.mount_rib_thickness < p.min_wall - 1e-9) err(["mount_rib_thickness"], "Mount rib is below min wall.");
    if (p.side_mount_hole_diameter + 2*p.min_wall > p.mount_rib_width + 1e-9 ||
        p.front_mount_hole_diameter + 2*p.min_wall > p.mount_rib_width + 1e-9)
      err(["mount_rib_width"], "Mount hole leaves less than min wall in a " + f(p.mount_rib_width) + " rib.");
    if (d.ribHeight < 4)
      err(["frame_height","beam_height"], "No room between the beam rows for the mount ribs.");
    if (p.beam_width/2 > p.beam_height - 1e-9)
      err(["beam_width","beam_height"], "Beam section " + f(p.beam_width) + " x " + f(p.beam_height) +
          " makes the underside steeper than 45 degrees; raise beam height or narrow the beam.");
    if (p.internal_rail_width > d.innerW/2 - 5)

    if (p.internal_rail_width > p.internal_rail_height + 1e-9)
      err(["internal_rail_width","internal_rail_height"],
          "Internal rail ledge would overhang past 45 degrees; keep width <= height.");
    if (d.midZ !== null && p.gusset_size > (d.midZ - d.z0) - p.beam_height)
      err(["gusset_size"], "Gussets from the lower ring would run into the stabilising ring.");
    if (d.midZ !== null && d.midZ + p.beam_height > d.socketZ0 - 1)
      err(["frame_height"], "The stabilising ring runs into the lid sockets.");
    var slope = Math.atan2(p.beam_width/2, p.beam_height) * 180/Math.PI;
    if (slope > env.overhangSafe)
      warn("Beam underside is " + f(slope) + " deg from vertical, past the " + env.overhangSafe +
           " deg limit of this profile.");
    if (p.mid_beam_rows === "None" && p.frame_height > 80)
      warn("A " + f(p.frame_height) + " tall frame with no stabilising ring will be soft in torsion.");
    if (!d.mounts)
      warn("Mount interfaces are disabled: CAGE_FRONT/REAR/LEFT/RIGHT_A publish an empty pattern, " +
           "so nothing can attach to the faces.");
    if (d.W > p.bed_size_x || d.D > p.bed_size_y || p.frame_height > p.bed_size_z)
      warn("Frame " + f(d.W) + " x " + f(d.D) + " x " + f(p.frame_height) +
           " exceeds the configured bed volume.");
  }

{

  derive: function (p, ctx) {
    var l = ctx.need("CAGE_BODY_LID@1"), d = {};
    d.W = l.footprint.width; d.D = l.footprint.depth;
    d.z0 = l.origin[2];
    d.z1 = d.z0 + p.lid_thickness;
    d.posts = l.postCentres;
    d.socket = l.socket;
    d.openW = d.W - 2*p.lid_frame_beam_width;
    d.openD = d.D - 2*p.lid_frame_beam_width;
    d.pinZ0 = d.z0 - p.lid_pin_length;
    d.effectivePin = p.lid_pin_diameter + p.lid_snap_interference;
    d.fit = d.socket.diameter - d.effectivePin;        /* positive = clearance, negative = press */
    d.mountX = d.W/2 - p.lid_frame_beam_width/2;

  },
  publish: function (p, ctx, d) {
    var pts = [];
    [-1, 1].forEach(function (sx) {
      [-1, 1].forEach(function (sy) { pts.push([sx*d.mountX, sy*p.lid_top_mount_pitch/2, d.z1]); });
    });
    return { "CAGE_TOP_A@1": {
      origin: [0, 0, d.z1], normal: [0, 0, 1], primaryAxis: [0, 1, 0],
      pattern: pts, holeDiameter: p.lid_top_mount_hole_diameter,
      envelope: { width: d.W, depth: d.D, upward: 80 },
      keepout: { what: "frame opening", width: d.openW, depth: d.openD }
    }};
  },
  mates: function (p, ctx, d) {
    var l = ctx.need("CAGE_BODY_LID@1");
    return d.posts.map(function (c, i) {
      return { id: "LID_PIN_" + i, with: "CAGE_BODY_LID@1", feature: "LID_PIN_" + i,
               kind: "pin_hole", type: "pin", axis: [0, 0, 1],
               at: [c[0], c[1], d.z0], diameter: p.lid_pin_diameter,
               clearance: l.socket.diameter - d.effectivePin };
    });
  },
  build: function (M, p, ctx, d) {
    var g = "cagelid", holes = [rect2(0, 0, d.openW, d.openD)];
    var r = p.lid_top_mount_hole_diameter/2;
    [-1, 1].forEach(function (sx) {
      [-1, 1].forEach(function (sy) { holes.push(circle2(sx*d.mountX, sy*p.lid_top_mount_pitch/2, r, 14)); });
    });
    addExtruded(M, g, roundRect2(0, 0, d.W, d.D, Math.min(p.lid_frame_beam_width*0.6, 6), 5),
                holes, d.z0, d.z1, XF.XY(0), "lid frame");
    if (p.lid_pin_length > 0.05 && p.lid_pin_diameter > 0.2)
      d.posts.forEach(function (c) {
        addCyl(M, g, c[0], c[1], d.pinZ0, d.z0, p.lid_pin_diameter/2, 0, 24);
      });
  },
  validate: function (p, ctx, d, err, warn, f) {
    var l = ctx.need("CAGE_BODY_LID@1");
    if (p.lid_thickness < p.min_wall - 1e-9) err(["lid_thickness"], "Lid is below min wall.");
    if (p.lid_frame_beam_width < 2*p.min_wall - 1e-9)
      err(["lid_frame_beam_width"], "Lid frame beam is under two wall thicknesses.");
    if (d.openW <= 5 || d.openD <= 5)
      err(["lid_frame_beam_width"], "Lid frame beam leaves no opening — this is a plate, not a frame.");
    if (d.effectivePin > d.socket.diameter + 1e-9)
      err(["lid_pin_diameter","lid_snap_interference"],
          "Pin " + f(d.effectivePin) + " (with interference) will not enter the " +
          f(d.socket.diameter) + " socket published by CAGE_BODY_LID v1.");
    if (p.lid_pin_length > d.socket.depth + 1e-9)
      err(["lid_pin_length"], "Pin " + f(p.lid_pin_length) + " is longer than the " +
          f(d.socket.depth) + " socket, so the lid will not close.");
    if (p.lid_pin_engagement > p.lid_pin_length + 1e-9)
      err(["lid_pin_engagement","lid_pin_length"], "Required engagement exceeds the pin length.");
    if (p.lid_pin_diameter + 2*p.min_wall > p.lid_frame_beam_width + 1e-9)
      err(["lid_pin_diameter","lid_frame_beam_width"], "Pin root is wider than the lid frame beam can carry.");
    if (p.lid_top_mount_pitch/2 + p.lid_top_mount_hole_diameter/2 > d.D/2 - p.lid_frame_beam_width/2)
      err(["lid_top_mount_pitch"], "Top mount holes fall off the lid frame beams.");
    if (d.fit < -p.lid_snap_interference - 1e-9)
      err(["lid_pin_diameter"], "Pin is larger than the socket by more than the declared interference.");
    if (d.fit > 0.6) warn("Pin fit is " + f(d.fit) + " loose; the lid will rattle.");
    if (p.lid_snap_interference > 0.3)
      warn("Snap interference " + f(p.lid_snap_interference) + " in PLA is likely to split the post.");
    if (p.lid_pin_engagement < 4) warn("Only " + f(p.lid_pin_engagement) + " of engagement asked for.");
  }

/* Not part of the head.  Print it once, measure it, and the numbers it gives you
   become a PRINT CAPABILITY PROFILE - so the fit clearances and the bridge limit
   stop being guesses. */
{
  id: "coupon", name: "Calibration Coupon", category: "SERVICE / COSMETIC", version: 1,
  frame: "base", utility: true,
  about: "Small test plate: four pin/hole pairs at rising clearance, plus an optional " +
         "bridge ladder. Print it on the machine and material you will use, try each pin " +
         "in each hole, then save the result as a named print capability profile.",
  color: [0.95, 0.78, 0.35],
  requires: [], provides: [],
  print: { orientation: "Z+ (plate on the bed)", supports: "NONE", transform: "asModelled",
           calibration: true,
           note: "The bridge ladder is meant to exceed the profile limit - that is what it " +
                 "measures. Print with supports OFF or the test means nothing." },
  groups: ["coupon"], refs: [],
  params: [
    ["coupon_pin_diameter",     "Test pin diameter",        1,  20, 0.1,  4.0],
    ["coupon_pin_height",       "Test pin height",          2,  40, 0.1, 10.0],
    ["coupon_clearance_start",  "First clearance",          0,   1, 0.01, 0.10],
    ["coupon_clearance_step",   "Clearance step",        0.01,   1, 0.01, 0.10],
    ["coupon_plate_thickness",  "Plate thickness",          1,  10, 0.1,  3.0],
    ["coupon_pitch",            "Pin / hole pitch",         5,  60, 0.1, 16.0],
    ["coupon_bridge",           "Bridge ladder",            0,   0, 0, "Enabled", "", ONOFF],
    ["coupon_bridge_start",     "First bridge span",        2, 100, 0.1,  5.0],
    ["coupon_bridge_step",      "Bridge span step",         1, 100, 0.1,  5.0],
    ["coupon_bridge_wall",      "Bridge wall thickness",    1,  10, 0.1,  3.0],
    ["coupon_bridge_height",    "Bridge height",            2,  60, 0.1,  8.0],
    ["coupon_bridge_roof",      "Bridge roof thickness",  0.2,  10, 0.1,  1.2],
    ["coupon_place_x",          "Bench position X",      -500, 500, 0.1, 220.0],
    ["coupon_place_y",          "Bench position Y",      -500, 500, 0.1, -160.0]
  ],
  derive: function (p) {
    var d = {}, i;
    d.n = 4;
    d.clear = [];
    for (i = 0; i < d.n; i++) d.clear.push(p.coupon_clearance_start + i*p.coupon_clearance_step);
    d.spans = [];
    for (i = 0; i < d.n; i++) d.spans.push(p.coupon_bridge_start + i*p.coupon_bridge_step);
    d.bridge = (p.coupon_bridge === "Enabled");
    d.rowW = (d.n - 1) * p.coupon_pitch + p.coupon_pitch;
    d.bridgeLen = d.bridge
      ? d.spans.reduce(function (a, b) { return a + b; }, 0) + (d.n + 1) * p.coupon_bridge_wall : 0;
    d.W = Math.max(d.rowW, d.bridgeLen) + 8;
    d.bandY = p.coupon_pitch * 0.9;
    d.maxSpan0 = d.spans[d.n-1];
    /* The bridge band is deeper than the longest gap, so the narrow direction of every
       bridge patch is the gap itself - that is the number the coupon is measuring. */
    d.bandBridge = d.bridge ? Math.max(d.bandY, d.maxSpan0 + 5) : 0;
    d.D = 2*d.bandY + d.bandBridge + 8;
    d.z0 = 0; d.z1 = p.coupon_plate_thickness;
    d.holeY = -d.D/2 + 4 + d.bandY/2;
    d.pinY  = d.holeY + d.bandY;
    d.bridgeY = d.pinY + d.bandY/2 + d.bandBridge/2;
    d.cx = p.coupon_place_x; d.cy = p.coupon_place_y;
    d.maxSpan = d.bridge ? d.spans[d.n-1] : 0;
    return d;
  },
  build: function (M, p, ctx, d) {
    var g = "coupon", i, holes = [], x0 = d.cx - (d.n-1)*p.coupon_pitch/2;
    for (i = 0; i < d.n; i++)
      holes.push(circle2(x0 + i*p.coupon_pitch, d.cy + d.holeY,
                         (p.coupon_pin_diameter + d.clear[i])/2, 24));
    addExtruded(M, g, rect2(d.cx, d.cy, d.W, d.D), holes, d.z0, d.z1, XF.XY(0), "coupon plate");
    for (i = 0; i < d.n; i++)
      addCyl(M, g, x0 + i*p.coupon_pitch, d.cy + d.pinY, d.z1, d.z1 + p.coupon_pin_height,
             p.coupon_pin_diameter/2, 0, 24);
    if (!d.bridge) return;
    var x = d.cx - d.bridgeLen/2;
    var y0 = d.cy + d.bridgeY - d.bandBridge/2, y1 = d.cy + d.bridgeY + d.bandBridge/2;
    var zTop = d.z1 + p.coupon_bridge_height;
    for (i = 0; i <= d.n; i++) {
      addBox(M, g, x, x + p.coupon_bridge_wall, y0, y1, d.z1, zTop);
      x += p.coupon_bridge_wall;
      if (i < d.n) x += d.spans[i];
    }
    addBox(M, g, d.cx - d.bridgeLen/2, d.cx + d.bridgeLen/2, y0, y1,
           zTop, zTop + p.coupon_bridge_roof);
  },
  validate: function (p, ctx, d, err, warn, f, env) {
    if (p.coupon_plate_thickness < env.minWall - 1e-9)
      err(["coupon_plate_thickness"], "Coupon plate " + f(p.coupon_plate_thickness) +
          " is below the effective minimum wall " + f(env.minWall) + ".");
    if (p.coupon_bridge_wall < env.minWall - 1e-9)
      err(["coupon_bridge_wall"], "Bridge wall is below the effective minimum wall.");
    if (p.coupon_bridge_roof < env.cap.layer_height*2 - 1e-9)
      err(["coupon_bridge_roof"], "A bridge roof thinner than two layers tells you nothing.");
    if (p.coupon_pin_diameter + d.clear[d.n-1] + 2*env.minWall > p.coupon_pitch - 1e-9)
      err(["coupon_pitch"], "Holes at " + f(p.coupon_pitch) + " pitch leave less than min wall between them.");
    if (d.W > p.bed_size_x || d.D > p.bed_size_y)
      err(["coupon_pitch","coupon_bridge_step"], "Coupon " + f(d.W) + " x " + f(d.D) +
          " does not fit the bed.");
    if (d.clear[0] <= 1e-9)
      warn("The first clearance is zero; that hole and pin will be an interference fit by design.");
    if (d.bridge && d.maxSpan <= env.bridgeSafe)
      warn("The longest bridge on the coupon is " + f(d.maxSpan) + " mm, which the profile already " +
           "calls safe (" + f(env.bridgeSafe) + " mm). Raise the span step or it measures nothing.");
    if (!env.calibrated)
      warn("This print capability profile is not calibrated yet. Print this coupon, measure it, " +
           "enter the results and lock the profile.");
  }
}

"use strict";
/* ================= EXACT CAD PREVIEW CLIENT ======================
   Experimental (app refactor Phase 4).  Talks to the localhost CAD API
   (server/cad_api.py) for the two migrated components and turns the exact
   binary STL it returns into a viewer mesh.  It owns no product model: the
   request is the current parameter state serialised through MS.PARAM, and the
   backend resolves the whole production model itself.

   Loaded after viewer.js and before app.js.  It reads P, S, MS, viewer and a few
   app.js functions only at call time.

   States: checking | unavailable | ready | building | exact-pass | exact-blocked | stale | error
   ("checking" only until the single startup status read has answered)

   Geometry authority (Phase 5) - migration state, not geometry truth, and the one
   place the UI status and the export routing ask:
     cagelid       EXACT_AUTHORITY        viewer and per-part STL are the same CadQuery build
     neckshoulder  EXACT_PREVIEW_BLOCKED  exact preview for inspection; export refused by
                                          migration policy (Phase 6 repaired the design;
                                          promotion is the Phase 7 decision)
     others        JS_LEGACY_AUTHORITY    the transitional JS geometry, unchanged
   The JS Cage Lid builder still runs inside the scene (metrics, validation, assembly
   checks depend on it) but it is no longer the user-facing STL.
   ================================================================ */
var CAD = (function () {
  var EXACT_GROUP = "__cad_exact__";
  var AUTHORITY = { cagelid: "EXACT_AUTHORITY", neckshoulder: "EXACT_PREVIEW_BLOCKED" };
  var LEGACY = "JS_LEGACY_AUTHORITY";
  var MIGRATED = { cagelid: true, neckshoulder: true };

    return MS.COMPONENTS.some(function (c) { return !c.utility && authorityOf(c.id) !== LEGACY; });
  }

    state: "checking",

    exact: null,              /* { component, snapshot, meta, group, bytes, timing, sha_verified, verified } */
    error: null,

    debug: { groups: {}, statusRequests: 0 }

  function init() {
    st.transport = (location.protocol === "file:") ? "file" : "http";

      .then(function (doc) {
        st.status = doc;

        refreshUI();

  /* ---- the request: current P through MS.PARAM, nothing else --------- */
  function request(component) {

  /* ---- binary STL -> viewer group ----------------------------------- */
  function parseSTL(buf) {

    try { req = request(component); } catch (e) { return fail("error", "REQUEST ERROR", e.message); }

      .then(function (r) { return r.json().then(function (doc) { return { status: r.status, doc: doc }; }); })

            if (snap !== snapshot(component) || S.sel !== component) {

  /* ---- exact export (Phase 5): the same verified build the viewer shows ---------- */
  /* The exact build for `component` when it is current: same component, same canonical

      var b = currentVerifiedBuild(id);
      if (b && b.meta.blockers && b.meta.blockers.length) msg += "\n  design blockers for the current parameters: " + b.meta.blockers.join(", ");

          "\n  ai_cube_" + id + ".stl · build " + m.build_id + " · " + e.group.n + " triangles · " + e.bytes.byteLength + " bytes" +
          "\n  bbox " + fmt(m.bbox[3]-m.bbox[0]) + " x " + fmt(m.bbox[4]-m.bbox[1]) + " x " + fmt(m.bbox[5]-m.bbox[2]) + " mm" +
          "\n  engine " + m.engine_status + " · design " + m.design_status + (r.cache_hit ? " · reused the verified preview build" : " · built now") +

        } else {

<script>

/* ---------------- browser-side cache (never the only copy) ---------------- */
var DB = { ok: false, db: null };
(function openDB() {
  try {
    if (!window.indexedDB) return;
    var rq = indexedDB.open("ai_cube_library", 1);
    rq.onupgradeneeded = function (e) {
      var db = e.target.result;
      if (!db.objectStoreNames.contains("components")) db.createObjectStore("components", { keyPath: "key" });
    };
    rq.onsuccess = function (e) { DB.db = e.target.result; DB.ok = true; loadCached(); };
    rq.onerror = function () { DB.ok = false; };
  } catch (e) { DB.ok = false; }
})();
function cacheComponent(key, doc) {
  if (!DB.ok) return;
  try {
    var tx = DB.db.transaction("components", "readwrite");
    tx.objectStore("components").put({ key: key, doc: doc });
  } catch (e) { /* the file on disk is always the real copy */ }
}
function uncacheComponent(key) {
  if (!DB.ok) return;
  try { DB.db.transaction("components", "readwrite").objectStore("components").delete(key); }
  catch (e) { /* ignore */ }
}
function loadCached() {
  try {
    var tx = DB.db.transaction("components", "readonly");
    var rq = tx.objectStore("components").getAll();
    rq.onsuccess = function () {
      var rows = rq.result || [], n = 0;
      rows.forEach(function (row) { if (LIB.add(row.doc).ok) n++; });
      if (n) { rebuild(); log(n + " component(s) restored from this browser's cache"); }
    };
  } catch (e) { /* ignore */ }
}

function instanceReport(iid) {
  if (!S.scene || !S.scene.inst) return null;
  var hit = S.scene.inst.report.filter(function (q) { return q.iid === iid; });
  return hit.length ? hit[0] : null;
}
function legoTargets(inst) {
  var out = [];
  if (!S.scene) return out;
  if (S.mode !== "build") MS.COMPONENTS.forEach(function (c) {
    if (c.utility) return;
    var q = S.scene.m.per[c.id];
    if (q && q.bbox) out.push({ value: "part:" + c.id, label: c.name, bbox: q.bbox });
  });
  if (S.scene.inst) S.scene.inst.report.forEach(function (q) {
    if (!q.missing && q.bbox && q.iid !== inst.iid)
      out.push({ value: "inst:" + q.iid, label: q.name + " [" + q.iid + "]", bbox: q.bbox });
  });
  return out;
}
function legoTargetBBox(value, inst) {
  var rows = legoTargets(inst), hit = rows.filter(function (x) { return x.value === value; });
  return hit.length ? hit[0].bbox : null;
}
function legoPlace(kind) {
  var inst = selectedInstance();
  if (!inst) return;
  var rep = instanceReport(inst.iid);
  if (!rep || !rep.bbox) { log("LEGO placement unavailable — selected block has no readable geometry"); return; }
  var sel = el("legoTarget"), target = sel ? legoTargetBBox(sel.value, inst) : null;
  if (kind !== "floor" && !target) { log("Choose a LEGO target first"); return; }

  /* Imported LEGO blocks are normally free.  If an older project had a snapped
     instance, make it free before the direct placement operation. */
  if (inst.attach) {
    inst.attach = null;
    inst.t = rep.place && rep.place.t ? rep.place.t.slice() : inst.t.slice();
    rebuild();
    rep = instanceReport(inst.iid);
    if (!rep || !rep.bbox) return;
  }

  var a = rep.bbox, d = [0,0,0];
  var ac = [(a[0]+a[3])/2, (a[1]+a[4])/2, (a[2]+a[5])/2];
  if (kind === "floor") d[2] = -a[2];
  else {
    var bc = [(target[0]+target[3])/2, (target[1]+target[4])/2, (target[2]+target[5])/2];
    if (kind === "top" || kind === "under") {
      d[0] = bc[0]-ac[0]; d[1] = bc[1]-ac[1];
      d[2] = kind === "top" ? target[5]-a[2] : target[2]-a[5];
    } else if (kind === "left" || kind === "right") {
      d[1] = bc[1]-ac[1]; d[2] = bc[2]-ac[2];
      d[0] = kind === "right" ? target[3]-a[0] : target[0]-a[3];
    } else if (kind === "front" || kind === "back") {
      d[0] = bc[0]-ac[0]; d[2] = bc[2]-ac[2];
      d[1] = kind === "back" ? target[4]-a[1] : target[1]-a[4];
    } else if (kind === "center") {
      d = [bc[0]-ac[0], bc[1]-ac[1], bc[2]-ac[2]];
    }

function syncInputs() {
  Array.prototype.forEach.call(el("left").querySelectorAll('input[data-k]'), function (r) {
    var k = r.getAttribute("data-k"), meta = MS.PARAM[k];
    var dec = meta.step < 0.1 ? 2 : (meta.step < 1 ? 2 : 1);
    if (r.type === "range") { if (parseFloat(r.value) !== P[k]) r.value = P[k]; }
    else if (document.activeElement !== r) r.value = P[k].toFixed(dec);
  });
}
var pending = false;
function schedule() {
  if (pending) return;
  pending = true;
  requestAnimationFrame(function () { pending = false; rebuild(); });
}
function setParam(k, v) {
  var meta = MS.PARAM[k];
  if (!meta) return;
  if (meta.enums) {
    P[k] = v;
    if (k === "design_profile") MS.applyDesignProfile(P, v, CAP);
    else if (MS.RECIPES[k]) MS.applyRecipe(P, k, v);
  } else {
    if (!isFinite(v)) return;
    P[k] = Math.round(v * 1000) / 1000;

}
function setCap(k, v) {
  var meta = MS.CAP_NUM[k];
  if (!meta || !isFinite(v)) return;
  if (CAP.locked) { log("the profile is LOCKED — unlock it to change " + k); return; }
  CAP[k] = Math.max(meta.min, Math.min(meta.max, Math.round(v * 1000) / 1000));
  var bad = MS.capabilityValidate(CAP);
  MS.applyCapability(P, CAP);
  buildLeft();
  rebuild(true);
  if (bad.length) log("PROFILE WARNING — " + bad.join("; "));
}

/* ---------------- line overlays ---------------- */
function pushSeg(a, p0, p1) { a.push(p0[0],p0[1],p0[2], p1[0],p1[1],p1[2]); }
function boxLines(a, b) {
  var c = [[b[0],b[1],b[2]],[b[3],b[1],b[2]],[b[3],b[4],b[2]],[b[0],b[4],b[2]],
           [b[0],b[1],b[5]],[b[3],b[1],b[5]],[b[3],b[4],b[5]],[b[0],b[4],b[5]]];
  [[0,1],[1,2],[2,3],[3,0],[4,5],[5,6],[6,7],[7,4],[0,4],[1,5],[2,6],[3,7]]
    .forEach(function (e) { pushSeg(a, c[e[0]], c[e[1]]); });
}
function buildLines(R, m) {
  if (!viewer.ok) return;
  var Rr = Math.max(P.base_outer_diameter/2, P.cage_base_width/2) + 40;
  var grid = [], step = 25, n = Math.ceil(Rr/step), i;
  for (i = -n; i <= n; i++) {
    pushSeg(grid, [i*step, -n*step, 0], [i*step, n*step, 0]);
    pushSeg(grid, [-n*step, i*step, 0], [n*step, i*step, 0]);
  }
  viewer.setLines("grid", grid, [0.17, 0.21, 0.27, 1]);
  var L = Rr * 0.85;
  viewer.setLines("axisX", [0,0,0, L,0,0], [0.95, 0.30, 0.30, 1]);
  viewer.setLines("axisY", [0,0,0, 0,L,0], [0.35, 0.90, 0.40, 1]);
  viewer.setLines("axisZ", [0,0,0, 0,0,L], [0.40, 0.60, 1.00, 1]);
  var top = (m.bbox ? m.bbox[5] : 300) + 40, yaw = [];
  for (i = 0; i * 12 < top; i++) { if (i % 2) continue; pushSeg(yaw, [0,0,i*12], [0,0,Math.min(top,(i+1)*12)]); }
  viewer.setLines("yaw", yaw, [1.0, 0.72, 0.30, 1]);
  var bb = [];
  if (m.bbox) boxLines(bb, m.bbox);
  var build = S.mode === "build";
  viewer.setLines("bbox", build ? [] : bb, [0.35, 0.50, 0.68, 1]);
  var mp = [];
  ["CAGE_LEFT_A@1","CAGE_RIGHT_A@1","CAGE_FRONT_A@1","CAGE_REAR_A@1","CAGE_TOP_A@1"].forEach(function (key) {
    var fI = R.ifaces[key];
    if (!fI || !fI.pattern) return;
    fI.pattern.forEach(function (q) {
      var nn = fI.normal, dd = 12;
      pushSeg(mp, q, [q[0]+nn[0]*dd, q[1]+nn[1]*dd, q[2]+nn[2]*dd]);
    });
  });
  viewer.setLines("mounts", build ? [] : mp, [0.45, 0.95, 1.0, 1]);
  var cr = R.ifaces["DRATEK_CRADLE@1"], br = [];
  if (cr) {
    var o = cr.openingAxis, bc = [cr.origin[0], cr.origin[1], cr.origin[2] + 20], k2 = 55;
    pushSeg(br, bc, [bc[0]+o[0]*k2, bc[1]+o[1]*k2, bc[2]+o[2]*k2]);
    pushSeg(br, [cr.centreFix.at[0], cr.centreFix.at[1], cr.origin[2] - 25],
                [cr.centreFix.at[0], cr.centreFix.at[1], cr.origin[2] + 25]);
  }
  viewer.setLines("cradle", build ? [] : br, [0.95, 0.72, 0.45, 1]);
  var sel = [];
  if (S.selInst && S.scene && S.scene.inst) {
    var rep = S.scene.inst.report.filter(function (q) { return q.iid === S.selInst; })[0];
    if (rep && rep.bbox) boxLines(sel, rep.bbox);
  }
  viewer.setLines("selbox", sel, [1.0, 0.85, 0.3, 1]);
}
