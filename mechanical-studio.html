     it explicitly with the simple relative-placement controls. */
  var opts = { attach: null };
  if (BUILTINS[doc.id]) {
    var bm = builtinMesh(doc);
    if (!bm) { log(doc.name + " has no geometry with the current parameters — nothing was added"); return; }
    opts.t = bm.anchor;
  }
  var inst = MS.newInstance(doc, opts);
  INSTANCES.push(inst);
  S.selInst = inst.iid; S.libSel = key;
  if (S.mode !== "build") setMode("build");
  rebuild();
  log("added " + doc.name + " v" + doc.version + " to the assembly" + (opts.t ? " at its design position" : " as a free block at the origin"));
}
var PENDING_IMPORTER_EDIT = null;
function openImporterForEdit(key) {
  var doc = LIB.items[key];
  if (!doc) return;
  PENDING_IMPORTER_EDIT = { key: key, doc: JSON.parse(JSON.stringify(doc)) };
  var url = location.protocol === "file:"
    ? "../component_importer/ai_cube_component_importer.html?studio=1"
    : "/component-importer?studio=1";
  var w = window.open(url, "ai_cube_component_importer");
  if (!w) {
    PENDING_IMPORTER_EDIT = null;
    log("Browser blocked the Component Importer window. Allow pop-ups for this local page.");
  }
}
function exportComponent(key) {
  var doc = LIB.items[key];
  if (!doc) return;
  download(new Blob([JSON.stringify(doc, null, 2)], { type: "application/json" }),
           doc.id + "_v" + doc.version + ".aicube");
  log("exported " + doc.id + "_v" + doc.version + ".aicube");
}
function replaceGeometry(key) {
  var doc = LIB.items[key];
  if (!doc) return;
  pickFile(".stl", true, function (f, buf) {
    var next = Math.max.apply(null, LIB.versions(doc.id)) + 1;
    var res = LIB.replaceGeometry(key, new Uint8Array(buf), next);
    if (!res.ok) { log("REPLACE REFUSED — " + res.why); return; }
    cacheComponent(res.key, LIB.items[res.key]);
    rebuild();
    log("geometry replaced from " + f.name + "\n  " + doc.name + " v" + doc.version +
        " is untouched; the new geometry is v" + next + " with the same anchors and metadata.");
  });
}
function toggleArchive(key) {
  var doc = LIB.items[key];
  if (!doc) return;
  if (doc.status === "ARCHIVED") LIB.unarchive(key);
  else LIB.archive(key);
  cacheComponent(key, doc);
  rebuild();
  log(doc.name + " v" + doc.version + " is now " + doc.status);
}
function removeComponent(key) {
  var doc = LIB.items[key];
  if (!doc) return;
  var used = INSTANCES.filter(function (i) { return MS.libKey(i.ref.id, i.ref.version) === key; }).length;
  if (!window.confirm("Delete " + doc.name + " v" + doc.version + " from the library?\n\n" +
      (used ? used + " placed instance(s) will report as MISSING.\n" : "") +
      "Project files saved on disk may still refer to it, and this tool cannot scan them. " +
      "Archive is usually the safer choice.")) return;
  LIB.remove(key);
  uncacheComponent(key);
  rebuild();
  log("removed " + key + " from the library. Files on disk are untouched.");
}
var ACTIONS = {
  reset: function () { P = MS.defaults(); MS.applyCapability(P, CAP); rebuild(true);
    log("parameters reset to defaults (the print capability profile is kept)"); },
  lockCapability: function () {
    var bad = MS.capabilityValidate(CAP);
    if (bad.length) { log("PROFILE REFUSED — " + bad.join("; ")); return; }
    CAP.locked = !CAP.locked;
    MS.applyCapability(P, CAP);
    rebuild(true); buildLeft();
    log("print capability profile " + CAP.name + " is " + (CAP.locked ? "LOCKED" : "unlocked"));
  },
  exportCapability: function () {
    download(new Blob([JSON.stringify(CAP, null, 2)], { type: "application/json" }),
             CAP.name + ".aicube-printer.json");
    log("exported " + CAP.name + ".aicube-printer.json");
  },
  importCapability: function () {
    pickFile(".json", false, function (f, txt) {
      var obj;
      try { obj = JSON.parse(txt); } catch (e) { log("not JSON: " + e.message); return; }
      var bad = MS.capabilityValidate(obj);
      if (bad.length) { log("PROFILE REFUSED — " + bad.join("; ")); return; }
      CAP = obj;
      MS.applyCapability(P, CAP);
      rebuild(true); buildLeft(); buildRight();
      log("loaded print capability profile " + CAP.name +
          (MS.capabilityCalibrated(CAP) ? " (calibrated)" : " (NOT calibrated — every limit is an estimate)"));
    });
  },
  resetCapability: function () {
    CAP = MS.capabilityDefault();
    MS.applyCapability(P, CAP);
    rebuild(true); buildLeft();
    log("print capability profile reset to " + CAP.name);
  },
  prepareComponent: function () {
    var url = location.protocol === "file:"
      ? "../component_importer/ai_cube_component_importer.html?studio=1"
      : "/component-importer?studio=1";
    var w = window.open(url, "ai_cube_component_importer");
    if (!w) log("Browser blocked the Component Importer window. Allow pop-ups for this local page.");
  },
  importComponent: function () {
    pickFile(".aicube,.json", false, function (f, txt) {
      var doc;
      try { doc = JSON.parse(txt); } catch (e) { log("not JSON: " + e.message); return; }
      var v = MS.aicubeValidate(doc);
      if (!v.ok) { log("IMPORT REFUSED — " + v.why); return; }
      importComponentDoc(doc, f.name);
    });
  },
  importSTLas: function () {
    pickFile(".stl", true, function (f, buf) {
      var base = f.name.replace(/\.stl$/i, "").replace(/[^A-Za-z0-9_]+/g, "_").toLowerCase();
      var doc;
      try {
        doc = MS.aicubeFromSTL({
          id: base, name: f.name.replace(/\.stl$/i, ""), version: 1,
          type: "REFERENCE", accuracy: "L0", status: "UNVERIFIED",
          about: "Imported straight from an STL. Give it anchors and provenance in the Component Importer.",
          provenance: { source: f.name, note: "imported without orientation or anchors", measurements: [] }
        }, new Uint8Array(buf));
      } catch (e) { log("IMPORT FAILED — " + e.message); return; }
      importComponentDoc(doc, f.name);
      log(LOG_TEXT + "\n  No origin or anchors were set. Use the Component Importer for that.");
    });
  },
  saveProject: function () {
    var prj = MS.saveProject(PROJECT.name, PROJECT.note, P, LIB, INSTANCES, CAP);
    download(new Blob([JSON.stringify(prj, null, 2)], { type: "application/json" }), PROJECT.name + ".json");
    log("saved " + PROJECT.name + ".json\n  " + prj.instances.length + " instance(s), " +
        prj.required_components.length + " component(s) required\n  " +
        (prj.required_components.join(", ") || "none"));
  },
  loadProject: function () {
    pickFile(".json", false, function (f, txt) {
      var obj;
      try { obj = JSON.parse(txt); } catch (e) { log("not JSON: " + e.message); return; }
      var res = MS.loadProject(obj, CAT);
      if (!res.ok) { log("LOAD REFUSED — " + res.fatal); return; }
      P = res.params; INSTANCES = res.instances;
      if (res.capability) CAP = res.capability;
      LIB.bindings = res.bindings;
      setProjectName(res.name); PROJECT.note = res.note;
      S.selInst = null; S.libSel = null;
      if (S.mode !== "build") setMode("build");
      rebuild();
      log("loaded " + f.name + "\n  " + res.report.join("\n  ") +
          (res.missing.length ? "\n  MISSING: " + res.missing.map(function (q) {
            return q.id + " v" + q.version; }).join(", ") : ""));
    });
  },
  duplicateInstance: function () {
    var i = S.selInst ? instOf(S.selInst) : null;
    if (!i) return;
    var doc = CAT.get(i.ref.id, i.ref.version);
    if (!doc) return;
    var copy = MS.newInstance(doc, {
      name: i.name + " copy", attach: i.attach ? JSON.parse(JSON.stringify(i.attach)) : null,
      t: i.t.slice(), r: i.r.slice(), locked: false, hidden: false
    });
    copy.t[0] = Math.round((copy.t[0] + 10) * 1000) / 1000;
    INSTANCES.push(copy); S.selInst = copy.iid; rebuild();
    log("duplicated " + i.name + " -> " + copy.name + " (+10 mm X)");
  },
  toggleLock: function () {
    var i = S.selInst ? instOf(S.selInst) : null;
    if (!i) return;
    i.locked = !i.locked; refreshPanels();
    log(i.name + " is " + (i.locked ? "LOCKED" : "unlocked"));
  },
  toggleHide: function () {
    var i = S.selInst ? instOf(S.selInst) : null;
    if (!i) return;
    i.hidden = !i.hidden; rebuild();
  },
  removeInstance: function () { if (S.selInst) removeInstanceById(S.selInst); },
  /* Replace = swap the Library reference of one placed block.  iid, attach, t, r, hidden
     and locked are untouched, so the block's origin keeps exactly the same placement:
     no solver, and nothing jumps. */
  replaceInstance: function () {
    var i = S.selInst ? instOf(S.selInst) : null, doc = catDoc(S.libSel);
    if (!i || !doc) {
      log("Replace — select a placed part, then an unused Library part, then press Replace.");
      return;
    }
    if (instKey(i) === catKey(doc)) {
      log(i.name + " already uses " + doc.name + " v" + doc.version + " — select a different Library block.");
      return;
    }
    var old = CAT.get(i.ref.id, i.ref.version), oldName = old ? old.name : i.ref.id, was = i.name;
    var oldLabel = oldName + " v" + i.ref.version;
    i.ref = { id: doc.id, version: doc.version };
    if (i.name.indexOf(oldName) === 0) i.name = doc.name + i.name.slice(oldName.length);
    S.libSel = catKey(doc);
    rebuild();
    log("replaced " + was + " (" + oldLabel + ") -> " + doc.name + " v" + doc.version +
        "\n  kept: X/Y/Z " + i.t.join(" ") + ", RX/RY/RZ " + i.r.join(" ") +
        (i.attach ? ", on " + i.attach.key : "") + (i.hidden ? ", hidden" : "") + (i.locked ? ", locked" : ""));
  },
  addSelected: function () { if (S.libSel) addInstanceFromLibrary(S.libSel); },
  /* these three exist for imported blocks only: a built-in part is not in LIB.items, so it
     can be neither edited in the importer nor deleted from the Library */
  editSelected: function () { if (LIB.items[S.libSel]) openImporterForEdit(S.libSel); },
  exportSelected: function () { if (LIB.items[S.libSel]) exportComponent(S.libSel); },
  deleteSelected: function () { if (LIB.items[S.libSel]) removeComponent(S.libSel); },
  snap: function () {
    var i = selectedInstance();
    if (!i) return;
    var key = el("snapSel") ? el("snapSel").value : "";
    i.attach = key ? { key: key } : null;
    i.t = [0, 0, 0]; i.r = [0, 0, 0];
    rebuild();
    log(key ? (i.name + " snapped to " + key + ", local offset reset to zero")
            : (i.name + " detached — free placement"));
  },
  copy: function () {
    var txt = MS.summary(P, S.scene.R, S.scene.m, S.scene.v);
    if (navigator.clipboard && navigator.clipboard.writeText)
      navigator.clipboard.writeText(txt).then(function () { log("summary copied"); }, fb);
    else fb();
    function fb() {
      var ta = document.createElement("textarea");
      ta.value = txt; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy"); log("summary copied"); }
      catch (e) { log("clipboard blocked — summary below\n\n" + txt); }
      document.body.removeChild(ta);
    }
  },
  test: function () { runSelfTest(); }
};
el("btnReset").onclick = ACTIONS.reset;
el("btnDrawer").onclick = function () { S.drawer = !S.drawer; applyShell(); };
el("btnSave").onclick  = ACTIONS.saveProject;
el("btnLoad").onclick  = ACTIONS.loadProject;
el("btnCopy").onclick  = ACTIONS.copy;
el("btnTest").onclick  = ACTIONS.test;
el("prjNameTop").value = PROJECT.name;
el("prjNameTop").onchange = function () { setProjectName(el("prjNameTop").value); };

/* ---------------- in-page self-test ---------------- */
function checksum(pos) {
  var h = 2166136261, i, v = new DataView(new ArrayBuffer(4));
  for (i = 0; i < pos.length; i++) {
    v.setFloat32(0, pos[i], true);
    h = ((h ^ v.getUint32(0, true)) >>> 0) * 16777619 >>> 0;
  }
  return h.toString(16);
}
function runSelfTest() {
  var out = ["AI_CUBE Mechanical Studio " + MS.STUDIO_VERSION + " — self-test"], pass = 0, fail = 0;
  function t(name, fn) {
    var r;
    try { r = fn(); } catch (e) { r = "threw: " + e.message; }
    if (r === true) { pass++; out.push("  PASS  " + name); }
    else { fail++; out.push("  FAIL  " + name + " -- " + r); }
  }
  t("assembly resolves with no geometry failures", function () {
    var R = MS.resolve(P, LIB), M = MS.build(P, R);
    return M.fails.length ? M.fails.join("; ") : true;
  });
  t("components reach siblings only through interfaces", function () {
    var bad = [];
    MS.COMPONENTS.forEach(function (c) {
      Object.keys(MS.scopeParams(P, c)).forEach(function (k) {
        if (MS.PARAM[k].owner !== c.id && MS.PARAM[k].owner !== "globals") bad.push(c.id + " sees " + k);
      });
    });
    return bad.length ? bad.join(", ") : true;
  });
  t("normal panel stays small", function () {
    var worst = 0, who = "";
    MS.COMPONENTS.forEach(function (c) {
      var n = c.params.filter(function (q) { return MS.tierOf(q[0]) === "NORMAL"; }).length +
              (MS.LINKED[c.id] || []).length;
      if (n > worst) { worst = n; who = c.name; }
    });
    return worst <= 10 ? true : who + " shows " + worst + " normal settings";
  });
  t(".aicube round trip keeps the STL bytes", function () {
    var buf = MS.buildBinarySTL(S.scene.mesh, MS.partGroups("cagelid"), "x");
    var u8 = new Uint8Array(buf);
    var doc = MS.aicubeFromSTL({ id: "rt_test", name: "RT", version: 1, type: "PRINTABLE",
                                 accuracy: "L1", status: "VERIFIED" }, u8);
    var back = MS.base64ToBytes(doc.geometry.data), i;
    if (back.length !== u8.length) return "length " + back.length + " != " + u8.length;
    for (i = 0; i < u8.length; i++) if (back[i] !== u8[i]) return "byte " + i + " differs";
    return MS.aicubeMesh(doc).n === doc.geometry.triangles || "decoded triangle count differs";
  });
  t("a newer .aicube schema is refused", function () {
    var doc = MS.aicubeNew({ id: "x", name: "x", version: 1 });
    doc.geometry = { encoding: "binary-stl-base64", data: "AA==" };
    doc.schema_version = MS.AICUBE_SCHEMA + 1;
    return MS.aicubeValidate(doc).ok === false || "it was accepted";
  });
  t("project round trip reproduces the assembly", function () {
    var prj = MS.saveProject(PROJECT.name, PROJECT.note, P, LIB, INSTANCES, CAP);
    var res = MS.loadProject(JSON.parse(JSON.stringify(prj)), CAT);
    if (!res.ok) return res.fatal;
    if (res.instances.length !== INSTANCES.length) return "instance count changed";
    var i;
    for (i = 0; i < INSTANCES.length; i++) {
      if (res.instances[i].t.join() !== INSTANCES[i].t.join()) return "translation changed";
      if (res.instances[i].r.join() !== INSTANCES[i].r.join()) return "rotation changed";
      if (JSON.stringify(res.instances[i].attach) !== JSON.stringify(INSTANCES[i].attach))
        return "attachment changed";
    }
    return true;
  });
  t("0.1 mm steps stay exact over 10 clicks", function () {
    var v0 = P.cage_base_plate_thickness, v = v0, i;
    for (i = 0; i < 10; i++) v = Math.round((v + 0.1) * 1000) / 1000;
    return Math.abs(v - (v0 + 1.0)) < 1e-9 ? true : "drifted to " + v;
  });
  t("0.05 mm steps stay exact over 20 clicks", function () {
    var v0 = P.general_clearance, v = v0, i;
    for (i = 0; i < 20; i++) v = Math.round((v + 0.05) * 1000) / 1000;
    return Math.abs(v - (v0 + 1.0)) < 1e-9 ? true : "drifted to " + v;
  });
  t("exporter refuses reference geometry", function () {
    try { MS.buildBinarySTL(S.scene.mesh, ["ref_mac"], "x"); return "no error thrown"; }
    catch (e) { return /refusing to export/.test(e.message) ? true : "wrong error: " + e.message; }
  });
  MS.exportTargets().forEach(function (x) {
    t("STL: " + x.name, function () {
      var buf = MS.buildBinarySTL(S.scene.mesh, MS.partGroups(x.id), x.id);
      var pr = MS.parseBinarySTL(buf);
      if (!pr.ok) return pr.why;
      if (pr.n < 4) return "only " + pr.n + " triangles";
      return true;
    });
  });
  t("the Drátek bracket is visibly unverified", function () {
    var cr = S.scene.R.ifaces["DRATEK_CRADLE@1"];
    if (!cr) return "no cradle interface";
    if (LIB.bindings.dratek_u_bracket) return true;      /* a real one is bound */
    if (cr.bracket.source !== "PLACEHOLDER") return "it claims to be " + cr.bracket.source;
    return S.scene.v.warnings.some(function (w) { return /PLACEHOLDER/.test(w.msg) && w.mod === "cradle"; })
      || "no placeholder warning";
  });
  t("every support-free part keeps its contract", function () {
    var bad = [];
    MS.COMPONENTS.forEach(function (c) {
      var pr = S.scene.m.per[c.id].print;
      if (!pr || !pr.supportFree) return;
      var hit = pr.checks.filter(function (x) { return x.name === "Support-free design" && !x.ok; });
      if (hit.length) bad.push(c.name + ": " + hit[0].detail);
    });
    return bad.length ? bad.join("; ") : true;
  });
  t("the neck prints as two support-free halves", function () {
    var bad = [];
    ["neckbase", "neckshoulder"].forEach(function (id) {
      var pr = S.scene.m.per[id].print;
      if (!pr) { bad.push(id + " has no geometry"); return; }
      ["Watertight", "Manifold", "Triangle validity", "Support path", "Support-free design"]
        .forEach(function (n) {
          var c = pr.checks.filter(function (x) { return x.name === n; })[0];
          if (!c || !c.ok) bad.push(id + " " + n);
        });
    });
    return bad.length ? bad.join(", ") : true;
  });
  t("the neck joint is one versioned interface and it mates", function () {
    var io = S.scene.R.ifaces["NECK_BASE_SHOULDER@1"];
    if (!io) return "the joint interface did not resolve";
    if (io.postCentres.length !== 4) return "expected four spigots";
    var bad = S.scene.ac.findings.filter(function (f) {
      return f.level !== "PASS" && /NECK_JOINT/.test(f.msg); });
    return bad.length ? bad.map(function (f) { return f.kind + " " + f.msg; }).join("; ") : true;
  });
  t("the cage frame has no long unsupported underside", function () {
    var pr = S.scene.m.per.cagebody.print;
    return pr.maxFlatSpan <= 4 ? true : "widest flat unsupported patch spans " + fmt(pr.maxFlatSpan, 1);
  });
  t("the deep geometry checks actually ran", function () {
    if (!S.scene.m.deep) return "metrics are still the shallow pass";
    var pend = MS.COMPONENTS.filter(function (c) {
      var pr = S.scene.m.per[c.id].print;
      return pr && pr.pending;
    });
    return pend.length ? pend.length + " component(s) still pending" : true;
  });
  t("every generated part is watertight and consistently wound", function () {
    var bad = [];
    MS.COMPONENTS.forEach(function (c) {
      var pr = S.scene.m.per[c.id].print;
      if (!pr || !pr.topology) return;
      var tp = pr.topology;
      if (tp.boundary || tp.nonManifold || tp.unbalanced || tp.degenerate || tp.invertedShells)
        bad.push(c.name);
    });
    return bad.length ? bad.join("; ") : true;
  });
  t("a broken mesh is rejected, not waved through", function () {
    var open = new Float32Array([0,0,0, 10,0,0, 0,10,0]);
    var tp = MS.meshTopology(open);
    return tp.boundary === 3 && !tp.watertight ? true : "an open triangle read as watertight";
  });
  t("the print capability profile is separate from the design profile", function () {
    if (MS.DESIGN_PROFILE_NAMES.indexOf(P.design_profile) < 0) return "unknown design profile";
    var keys = Object.keys(MS.DESIGN_PROFILES.Light);
    if (keys.indexOf("bridge_safe_mm") >= 0 || keys.indexOf("overhang_safe_deg") >= 0)
      return "the design profile still carries manufacturing limits";
    return typeof CAP.bridge_safe_mm === "number" && typeof CAP.overhang_hard_deg === "number"
      ? true : "the capability profile has no bridge or overhang limit";
  });
  t("the assembly check runs and names its kinds", function () {
    var ac = S.scene.ac;
    if (!ac) return "no assembly check in the scene";
    var bad = ac.findings.filter(function (f) { return MS.ASSEMBLY_KINDS.indexOf(f.kind) < 0; });
    return bad.length ? "unknown finding kind " + bad[0].kind : true;
  });
  out.push("  " + pass + " passed, " + fail + " failed");
  log(out.join("\n"));
  return { pass: pass, fail: fail, text: out.join("\n") };
}

/* Component Importer -> Library bridge.  Same-origin localhost is preferred; file://
   is accepted only for the existing offline fallback. */
window.addEventListener("message", function (ev) {
  if (!ev.data) return;
  if (location.protocol !== "file:" && ev.origin !== location.origin) return;

  if (ev.data.type === "AI_CUBE_IMPORTER_READY") {
    if (PENDING_IMPORTER_EDIT && ev.source) {
      ev.source.postMessage({ type: "AI_CUBE_LOAD_COMPONENT",
                              doc: PENDING_IMPORTER_EDIT.doc,
                              editKey: PENDING_IMPORTER_EDIT.key },
                            location.protocol === "file:" ? "*" : location.origin);
    }
    return;
  }

  if (ev.data.type !== "AI_CUBE_COMPONENT_TO_STUDIO") return;
  var doc = ev.data.doc, v = MS.aicubeValidate(doc);
  if (!v.ok) { log("IMPORTER RETURN REFUSED — " + v.why); return; }

  var oldKey = ev.data.editKey || null;
  if (oldKey) {
    var res = LIB.add(doc);
    if (!res.ok) { log("EDIT RETURN REFUSED — " + res.why); return; }
    cacheComponent(res.key, doc);

    INSTANCES.forEach(function (i) {
      if (MS.libKey(i.ref.id, i.ref.version) === oldKey)
        i.ref = { id: doc.id, version: doc.version };
    });
    Object.keys(LIB.bindings).forEach(function (slot) {
      if (LIB.bindings[slot] === oldKey) LIB.bindings[slot] = res.key;
    });
    PENDING_IMPORTER_EDIT = null;
    S.libSel = res.key;
    if (S.mode !== "build") setMode("build");
    rebuild();
    log("edited " + oldKey + " -> " + res.key +
        "\n  placed instances and reference-slot bindings were moved to the new version");
    return;
  }

  if (importComponentDoc(doc, "Component Importer") && S.mode !== "build") setMode("build");
});

/* ---------------- init ---------------- */
buildModes();
buildViewBar();
rebuild(true);
CAD.init();                                   /* one status read; file:// asks nothing */
(function loop() { requestAnimationFrame(loop); })();
